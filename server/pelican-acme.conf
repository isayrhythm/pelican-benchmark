# Narrow exclusion from the existing HTTP reverse proxy, for certificate renewal.
ProxyPass /.well-known/acme-challenge/ !
Alias /.well-known/acme-challenge/ /home/pelican-certbot/webroot/.well-known/acme-challenge/
<Directory /home/pelican-certbot/webroot/.well-known/acme-challenge/>
    Require all granted
</Directory>
