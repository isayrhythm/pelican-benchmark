Listen 8049
<VirtualHost *:443 *:8049>
    ServerName 116.205.226.31
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/116.205.226.31/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/116.205.226.31/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    ProxyRequests Off
    ProxyAddHeaders Off
    RequestHeader unset X-Pelican-IP
    RequestHeader set X-Pelican-IP "expr=%{REMOTE_ADDR}"
    ProxyPass / http://127.0.0.1:8792/ connectiontimeout=3 timeout=15
    ProxyPassReverse / http://127.0.0.1:8792/
    LimitRequestBody 2048
    ErrorLog /var/log/apache2/pelican-error.log
    # No access log: do not retain visitor IDs from query strings.
</VirtualHost>
