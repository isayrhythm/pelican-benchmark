 series.forEach(s=>{const button=document.createElement('button');button.className='tab';button.setAttribute('role','tab');button.setAttribute('aria-selected',String(s.id===active));button.innerHTML=icons[s.id]||'';const label=document.createElement('span');label.textContent=s.name;const count=document.createElement('span');count.className='count';count.textContent=s.id==='all'?works.length:works.filter(w=>w.series===s.id).length;button.append(label,count);button.onclick=()=>{active=s.id;render()};document.getElementById('tabs').append(button)});
 const filtered=works.filter(w=>active==='all'||w.series===active),family=series.find(s=>s.id===active).name;
 document.getElementById('series-title').textContent=family+' · '+filtered.length+' 个作品';document.getElementById('empty').hidden=filtered.length>0;document.getElementById('empty-title').textContent=family;
 filtered.forEach((work,index)=>{
  const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='card-head';const number=document.createElement('span');number.className='number';number.textContent=String(index+1).padStart(2,'0');const input=document.createElement('input');input.className='model';input.value=saved[work.file]??(work.assistant||work.model);input.setAttribute('aria-label','模型名称');input.oninput=()=>{if(work.assistant)work.assistant=input.value;else work.model=input.value;saved[work.file]=input.value;try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch{}};head.append(number,input);
  const wrap=document.createElement('div');wrap.className='frame-wrap';const frame=document.createElement('iframe');frame.src=work.file+'?embed=1';frame.title=input.value;frame.setAttribute('sandbox','allow-scripts');wrap.append(frame);
  const meta=document.createElement('div');meta.className='card-meta';
  [['Harness',work.harness],['平台',work.platform]].forEach(([label,value])=>{const tag=document.createElement('span');tag.className='meta-tag';tag.textContent=value||'未注明';tag.title=label+' · '+(value||'未注明');meta.append(tag)});
  input.title=work.notes?(work.assistant||work.model)+' — '+work.notes:(work.assistant||work.model);
  if(work.notes){const note=document.createElement('span');note.className='card-description';note.textContent=work.notes;note.title=work.notes;head.append(note)}
  if(work.notes){input.style.width='46px';input.style.flex='0 0 46px'}
  card.append(head,meta);
  card.append(wrap);gallery.append(card);
 });
}
render();
const copyPrompt=document.getElementById('copy-prompt');
let copyTimer;
copyPrompt.onclick=async()=>{
 const text=document.getElementById('prompt-text').textContent.trim();
 let copied=false;
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(text);
   copied=true;
  }
 }catch{}
 // 本地文件或浏览器不支持 Clipboard API 时使用兼容方式。
 if(!copied){
  const field=document.createElement('textarea');
  field.value=text;field.setAttribute('readonly','');
  field.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.append(field);field.select();
  try{copied=document.execCommand('copy')}catch{}
  field.remove();copyPrompt.focus();
 }
 clearTimeout(copyTimer);
 copyPrompt.textContent=copied?'已复制 ✓':'复制失败';
 copyPrompt.setAttribute('aria-label',copied?'提示词已复制':'复制失败，请重试');
 if(!copied){
  const selection=window.getSelection(),range=document.createRange();
  range.selectNodeContents(document.getElementById('prompt-text'));
  selection.removeAllRanges();selection.addRange(range);
  const notice=document.getElementById('notice');
  notice.textContent='请按 Ctrl+C（Mac：⌘C）复制选中的提示词';notice.style.display='block';
  setTimeout(()=>notice.style.display='none',4000);
 }
 copyTimer=setTimeout(()=>{copyPrompt.textContent='复制';copyPrompt.setAttribute('aria-label','复制完整提示词')},2000);
};
document.getElementById('reload').onclick=()=>gallery.querySelectorAll('iframe').forEach(frame=>{frame.src=frame.getAttribute('src')});
document.getElementById('export').onclick=()=>{
 const labels=works.map(w=>w.assistant?({...w,assistant:saved[w.file]??w.assistant}):({...w,model:saved[w.file]??w.model}));const clone=document.documentElement.cloneNode(true);clone.querySelector('#gallery').replaceChildren();clone.querySelector('#tabs').replaceChildren();clone.querySelector('#copy-prompt').textContent='复制';clone.querySelector('#copy-prompt').setAttribute('aria-label','复制完整提示词');clone.querySelector('#notice').style.display='none';const script=clone.querySelector('script'),start=script.textContent.indexOf('const works='),end=script.textContent.indexOf('const storageKey=');script.textContent=script.textContent.slice(0,start)+'const works='+JSON.stringify(labels,null,2).replace(/</g,'\\u003c')+';\n'+script.textContent.slice(end);const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);const notice=document.getElementById('notice');notice.textContent='已导出 index.html';notice.style.display='block';setTimeout(()=>notice.style.display='none',3000);
};
</script></body></html>
