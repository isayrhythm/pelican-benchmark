<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(#bfe6ff 0%, #e8f7ff 70%, #cdeeb0 70%, #9bd17a 100%);
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 车轮旋转 */
  .wheel {
    transform-origin: 250px 380px;
    animation: spin 0.8s linear infinite;
  }
  .wheel-front {
    transform-origin: 550px 380px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* 脚踏旋转 */
  .crank {
    transform-origin: 400px 380px;
    animation: spin 0.8s linear infinite;
  }

  /* 鹈鹕整体上下颠簸 */
  .pelican {
    animation: bob 0.4s ease-in-out infinite alternate;
  }
  @keyframes bob {
    from { transform: translateY(0px); }
    to   { transform: translateY(-6px); }
  }

  /* 翅膀扇动 */
  .wing {
    transform-origin: 360px 200px;
    animation: flap 0.4s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: rotate(-6deg); }
    to   { transform: rotate(10deg); }
  }

  /* 尾巴摆动 */
  .tail {
    transform-origin: 300px 200px;
    animation: wag 0.4s ease-in-out infinite alternate;
  }
  @keyframes wag {
    from { transform: rotate(4deg); }
    to   { transform: rotate(-4deg); }
  }

  /* 道路标线滚动，模拟前进 */
  .road-line {
    animation: roll 0.6s linear infinite;
  }
  @keyframes roll {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }

  /* 云朵漂移 */
  .cloud {
    animation: drift 18s linear infinite;
  }
  .cloud-b {
    animation: drift 26s linear infinite;
    animation-delay: -10s;
  }
  @keyframes drift {
    from { transform: translateX(-200px); }
    to   { transform: translateX(1000px); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

  <!-- 云朵 -->
  <g class="cloud">
    <ellipse cx="120" cy="80" rx="50" ry="22" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="150" cy="70" rx="35" ry="22" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="95"  cy="72" rx="30" ry="18" fill="#ffffff" opacity="0.9"/>
  </g>
  <g class="cloud-b">
    <ellipse cx="600" cy="60" rx="45" ry="20" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="630" cy="50" rx="30" ry="20" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="575" cy="52" rx="26" ry="16" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- 太阳 -->
  <circle cx="700" cy="90" r="36" fill="#ffd43b"/>

  <!-- 远处的树 -->
  <g fill="#7cbf5e">
    <circle cx="60"  cy="330" r="40"/>
    <rect x="52" y="330" width="16" height="50" fill="#8b5a2b"/>
    <circle cx="740" cy="320" r="46"/>
    <rect x="732" y="320" width="16" height="60" fill="#8b5a2b"/>
  </g>

  <!-- 道路 -->
  <rect x="0" y="420" width="800" height="80" fill="#6b6b6b"/>
  <rect x="0" y="416" width="800" height="6" fill="#4a4a4a"/>
  <g class="road-line" stroke="#ffffff" stroke-width="6" stroke-dasharray="40 40">
    <line x1="-120" y1="460" x2="920" y2="460"/>
  </g>

  <!-- 自行车 -->
  <g id="bike" stroke="#222" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后轮 -->
    <g class="wheel">
      <circle cx="250" cy="380" r="70" stroke="#222" stroke-width="10"/>
      <line x1="250" y1="310" x2="250" y2="450" stroke-width="3"/>
      <line x1="180" y1="380" x2="320" y2="380" stroke-width="3"/>
      <line x1="200" y1="330" x2="300" y2="430" stroke-width="3"/>
      <line x1="300" y1="330" x2="200" y2="430" stroke-width="3"/>
    </g>
    <!-- 前轮 -->
    <g class="wheel-front">
      <circle cx="550" cy="380" r="70" stroke="#222" stroke-width="10"/>
      <line x1="550" y1="310" x2="550" y2="450" stroke-width="3"/>
      <line x1="480" y1="380" x2="620" y2="380" stroke-width="3"/>
      <line x1="500" y1="330" x2="600" y2="430" stroke-width="3"/>
      <line x1="600" y1="330" x2="500" y2="430" stroke-width="3"/>
    </g>

    <!-- 车架 -->
    <line x1="250" y1="380" x2="400" y2="380" stroke="#e03131" stroke-width="10"/>
    <line x1="400" y1="380" x2="340" y2="250" stroke="#e03131" stroke-width="10"/>
    <line x1="340" y1="250" x2="500" y2="250" stroke="#e03131" stroke-width="10"/>
    <line x1="400" y1="380" x2="500" y2="250" stroke="#e03131" stroke-width="10"/>
    <line x1="250" y1="380" x2="340" y2="250" stroke="#e03131" stroke-width="8"/>
    <line x1="500" y1="250" x2="550" y2="380" stroke="#e03131" stroke-width="10"/>
    <!-- 车把 -->
    <line x1="500" y1="250" x2="512" y2="200" stroke-width="8"/>
    <line x1="500" y1="200" x2="530" y2="196" stroke-width="8"/>
    <!-- 座椅 -->
    <path d="M318 240 Q340 228 362 240" stroke="#222" stroke-width="12"/>
  </g>

  <!-- 脚踏（旋转） -->
  <g class="crank">
    <line x1="400" y1="380" x2="400" y2="340" stroke="#444" stroke-width="7" stroke-linecap="round"/>
    <line x1="385" y1="340" x2="415" y2="340" stroke="#444" stroke-width="9" stroke-linecap="round"/>
    <circle cx="400" cy="380" r="9" fill="#444"/>
  </g>

  <!-- 鹈鹕 -->
  <g class="pelican">
    <!-- 尾巴 -->
    <g class="tail">
      <path d="M305 200 L262 168 L270 195 L255 205 L300 218 Z" fill="#f4a261"/>
    </g>

    <!-- 腿（脚踩脚踏附近） -->
    <line x1="375" y1="252" x2="392" y2="338" stroke="#ff8c42" stroke-width="10" stroke-linecap="round"/>
    <line x1="395" y1="252" x2="405" y2="336" stroke="#ff8c42" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M380 340 L404 340 L392 352 Z" fill="#ff8c42"/>

    <!-- 身体 -->
    <ellipse cx="370" cy="205" rx="82" ry="48" transform="rotate(-18 370 205)" fill="#f5f5f5" stroke="#444" stroke-width="3"/>

    <!-- 翅膀 -->
    <g class="wing">
      <path d="M345 185 Q300 150 320 120 Q360 150 400 170 Z" fill="#d8d8d8" stroke="#444" stroke-width="3"/>
      <path d="M335 190 Q290 175 300 150 Q345 165 380 190 Z" fill="#bdbdbd" stroke="#444" stroke-width="2"/>
    </g>

    <!-- 脖子 -->
    <path d="M425 185 Q455 150 470 120" stroke="#f5f5f5" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M425 185 Q455 150 470 120" stroke="#444" stroke-width="37" fill="none" stroke-linecap="round" opacity="0.15"/>

    <!-- 头 -->
    <circle cx="478" cy="108" r="28" fill="#f5f5f5" stroke="#444" stroke-width="3"/>

    <!-- 大嘴与喉囊 -->
    <path d="M495 112 L588 138 Q578 160 548 162 Q520 160 500 138 Z" fill="#ffb347" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
    <path d="M500 128 L586 136" stroke="#444" stroke-width="3"/>
    <path d="M505 140 Q530 176 556 156" fill="#ff8c42" stroke="#444" stroke-width="2.5"/>

    <!-- 眼睛 -->
    <circle cx="486" cy="100" r="6" fill="#ffffff" stroke="#444" stroke-width="2"/>
    <circle cx="488" cy="101" r="3" fill="#222"/>

    <!-- 腮红 -->
    <circle cx="472" cy="120" r="5" fill="#ff8fa3" opacity="0.6"/>

    <!-- 头顶小羽毛 -->
    <path d="M466 84 Q462 70 474 74 Q472 80 478 82" fill="#f5f5f5" stroke="#444" stroke-width="2"/>
  </g>

  <!-- 路牌装饰 -->
  <rect x="690" y="380" width="8" height="40" fill="#555"/>
  <rect x="650" y="340" width="90" height="46" rx="6" fill="#2f9e44"/>
  <text x="695" y="369" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">骑行中</text>
</svg>
</body>
</html>
