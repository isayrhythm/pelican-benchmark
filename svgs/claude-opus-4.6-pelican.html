<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #0d1b2a;
    overflow: hidden;
  }
  svg {
    width: 100vw;
    height: 100vh;
  }
</style>
<script src="../embed.js" defer></script>
</head>
<body>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="40%" stop-color="#42A5F5"/>
      <stop offset="80%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    <!-- Road surface -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#757575"/>
      <stop offset="50%" stop-color="#616161"/>
      <stop offset="100%" stop-color="#424242"/>
    </linearGradient>
  </defs>

  <!-- ============ SKY ============ -->
  <rect width="1000" height="450" fill="url(#sky)"/>

  <!-- ============ SUN ============ -->
  <circle cx="850" cy="90" r="90" fill="url(#sunGlow)"/>
  <circle cx="850" cy="90" r="38" fill="#FFC107">
    <animate attributeName="r" values="38;41;38" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Sun rays -->
  <g opacity="0.3">
    <line x1="850" y1="40" x2="850" y2="20" stroke="#FFD54F" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y2" values="20;15;20" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="885" y1="55" x2="900" y2="42" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <line x1="900" y1="90" x2="920" y2="90" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <line x1="885" y1="125" x2="900" y2="138" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <line x1="815" y1="55" x2="800" y2="42" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <line x1="800" y1="90" x2="780" y2="90" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
    <line x1="815" y1="125" x2="800" y2="138" stroke="#FFD54F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ============ CLOUDS ============ -->
  <!-- Cloud 1 -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" from="-250,0" to="1250,0" dur="28s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="100" rx="55" ry="22" fill="white"/>
    <ellipse cx="30" cy="88" rx="38" ry="20" fill="white"/>
    <ellipse cx="-25" cy="93" rx="32" ry="16" fill="white"/>
    <ellipse cx="10" cy="80" rx="28" ry="14" fill="#F5F5F5"/>
  </g>
  <!-- Cloud 2 -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" from="-400,0" to="1300,0" dur="40s" repeatCount="indefinite"/>
    <ellipse cx="300" cy="150" rx="48" ry="19" fill="white"/>
    <ellipse cx="325" cy="140" rx="32" ry="16" fill="white"/>
    <ellipse cx="280" cy="145" rx="28" ry="14" fill="white"/>
  </g>
  <!-- Cloud 3 -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="-150,0" to="1300,0" dur="50s" repeatCount="indefinite"/>
    <ellipse cx="650" cy="75" rx="60" ry="24" fill="white"/>
    <ellipse cx="685" cy="63" rx="42" ry="22" fill="white"/>
    <ellipse cx="620" cy="68" rx="38" ry="18" fill="#F5F5F5"/>
  </g>

  <!-- ============ SMALL BIRDS IN SKY ============ -->
  <g opacity="0.5">
    <animateTransform attributeName="transform" type="translate" from="-100,0" to="1100,0" dur="12s" repeatCount="indefinite"/>
    <path d="M 0,180 Q 5,175 10,180 Q 15,175 20,180" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M 40,170 Q 44,166 48,170 Q 52,166 56,170" fill="none" stroke="#333" stroke-width="1.2"/>
    <path d="M 15,195 Q 19,191 23,195 Q 27,191 31,195" fill="none" stroke="#333" stroke-width="1"/>
  </g>

  <!-- ============ BACKGROUND HILLS ============ -->
  <path d="M0,410 Q100,370 220,395 Q350,340 480,380 Q580,350 700,375 Q830,345 950,370 L1000,380 L1000,450 L0,450 Z" fill="#81C784" opacity="0.5"/>
  <path d="M0,425 Q120,395 260,415 Q400,380 530,405 Q680,375 820,400 Q920,385 1000,395 L1000,450 L0,450 Z" fill="#66BB6A" opacity="0.6"/>

  <!-- ============ SCROLLING BACKGROUND TREES ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-500,0" dur="6s" repeatCount="indefinite"/>
    <!-- Tree set 1 -->
    <rect x="80" y="388" width="8" height="42" fill="#6D4C41" rx="2"/>
    <circle cx="84" cy="378" r="22" fill="#388E3C"/>
    <circle cx="74" cy="368" r="17" fill="#43A047"/>
    <circle cx="94" cy="372" r="15" fill="#43A047"/>

    <rect x="280" y="392" width="7" height="38" fill="#5D4037" rx="2"/>
    <circle cx="283" cy="383" r="20" fill="#2E7D32"/>
    <circle cx="274" cy="374" r="15" fill="#388E3C"/>
    <circle cx="293" cy="377" r="14" fill="#388E3C"/>

    <rect x="530" y="386" width="9" height="44" fill="#6D4C41" rx="2"/>
    <circle cx="534" cy="376" r="24" fill="#388E3C"/>
    <circle cx="524" cy="366" r="18" fill="#4CAF50"/>
    <circle cx="545" cy="370" r="16" fill="#43A047"/>

    <rect x="750" y="390" width="7" height="40" fill="#5D4037" rx="2"/>
    <circle cx="753" cy="381" r="20" fill="#2E7D32"/>
    <circle cx="744" cy="373" r="16" fill="#388E3C"/>
    <circle cx="763" cy="375" r="14" fill="#43A047"/>

    <!-- Duplicate set for seamless loop -->
    <rect x="1080" y="388" width="8" height="42" fill="#6D4C41" rx="2"/>
    <circle cx="1084" cy="378" r="22" fill="#388E3C"/>
    <circle cx="1074" cy="368" r="17" fill="#43A047"/>
    <circle cx="1094" cy="372" r="15" fill="#43A047"/>

    <rect x="1280" y="392" width="7" height="38" fill="#5D4037" rx="2"/>
    <circle cx="1283" cy="383" r="20" fill="#2E7D32"/>
    <circle cx="1274" cy="374" r="15" fill="#388E3C"/>
    <circle cx="1293" cy="377" r="14" fill="#388E3C"/>
  </g>

  <!-- ============ GROUND ============ -->
  <rect y="445" width="1000" height="155" fill="url(#ground)"/>

  <!-- ============ ROAD ============ -->
  <rect y="430" width="1000" height="48" fill="url(#road)" rx="2"/>
  <!-- Road edge lines -->
  <line x1="0" y1="432" x2="1000" y2="432" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="0" y1="476" x2="1000" y2="476" stroke="#9E9E9E" stroke-width="1.5"/>
  <!-- Road center dashed line -->
  <line x1="0" y1="454" x2="1000" y2="454" stroke="#FDD835" stroke-width="2.5" stroke-dasharray="28,18">
    <animate attributeName="stroke-dashoffset" from="0" to="-46" dur="0.4s" repeatCount="indefinite"/>
  </line>

  <!-- ============ DUST PARTICLES BEHIND BIKE ============ -->
  <g opacity="0.4">
    <circle r="3" fill="#A1887F">
      <animate attributeName="cx" values="345;280;220;160" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="470;465;460;458" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.3;0.1;0" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;4;5" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#BCAAA4">
      <animate attributeName="cx" values="340;285;235;185" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="473;470;467;465" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.25;0.1;0" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5;2.5;3.5;4" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#A1887F">
      <animate attributeName="cx" values="350;300;250;200" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="468;462;457;454" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.2;0.1;0" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;2;3;4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============================================================ -->
  <!-- ================ BICYCLE + PELICAN GROUP =================== -->
  <!-- ============================================================ -->
  <g transform="translate(450, 0)">

    <!-- ========== BICYCLE ========== -->

    <!-- Rear Wheel -->
    <g transform="translate(-65, 454)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <!-- Tire -->
        <circle r="34" fill="none" stroke="#37474F" stroke-width="5"/>
        <!-- Rim -->
        <circle r="29" fill="none" stroke="#78909C" stroke-width="1.5"/>
        <!-- Spokes -->
        <line x1="0" y1="-31" x2="0" y2="31" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="-31" y1="0" x2="31" y2="0" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="-22" y1="-22" x2="22" y2="22" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="22" y1="-22" x2="-22" y2="22" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="-11" y1="-29" x2="11" y2="29" stroke="#B0BEC5" stroke-width="0.6"/>
        <line x1="11" y1="-29" x2="-11" y2="29" stroke="#B0BEC5" stroke-width="0.6"/>
        <line x1="-29" y1="-11" x2="29" y2="11" stroke="#B0BEC5" stroke-width="0.6"/>
        <line x1="-29" y1="11" x2="29" y2="-11" stroke="#B0BEC5" stroke-width="0.6"/>
      </g>
      <!-- Hub -->
      <circle r="4.5" fill="#90A4AE"/>
      <circle r="2" fill="#546E7A"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(95, 454)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <circle r="34" fill="none" stroke="#37474F" stroke-width="5"/>
        <circle r="29" fill="none" stroke="#78909C" stroke-width="1.5"/>
        <line x1="0" y1="-31" x2="0" y2="31" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="-31" y1="0" x2="31" y2="0" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="-22" y1="-22" x2="22" y2="22" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="22" y1="-22" x2="-22" y2="22" stroke="#B0BEC5" stroke-width="0.8"/>
        <line x1="-11" y1="-29" x2="11" y2="29" stroke="#B0BEC5" stroke-width="0.6"/>
        <line x1="11" y1="-29" x2="-11" y2="29" stroke="#B0BEC5" stroke-width="0.6"/>
        <line x1="-29" y1="-11" x2="29" y2="11" stroke="#B0BEC5" stroke-width="0.6"/>
        <line x1="-29" y1="11" x2="29" y2="-11" stroke="#B0BEC5" stroke-width="0.6"/>
      </g>
      <circle r="4.5" fill="#90A4AE"/>
      <circle r="2" fill="#546E7A"/>
    </g>

    <!-- Frame -->
    <!-- Seat tube: seat cluster to bottom bracket -->
    <line x1="-35" y1="390" x2="5" y2="443" stroke="#C62828" stroke-width="5" stroke-linecap="round"/>
    <!-- Down tube: head tube to bottom bracket -->
    <line x1="80" y1="400" x2="5" y2="443" stroke="#C62828" stroke-width="5" stroke-linecap="round"/>
    <!-- Top tube: seat cluster to head tube -->
    <line x1="-35" y1="390" x2="80" y2="400" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
    <!-- Chain stay: bottom bracket to rear axle -->
    <line x1="5" y1="443" x2="-65" y2="454" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
    <!-- Seat stay: seat cluster to rear axle -->
    <line x1="-35" y1="390" x2="-65" y2="454" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
    <!-- Fork: head tube to front axle -->
    <line x1="80" y1="400" x2="95" y2="454" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>

    <!-- Seat post -->
    <line x1="-35" y1="390" x2="-38" y2="378" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <!-- Seat -->
    <ellipse cx="-40" cy="375" rx="14" ry="5" fill="#3E2723"/>
    <ellipse cx="-42" cy="374" rx="10" ry="3.5" fill="#4E342E"/>

    <!-- Handlebar stem -->
    <line x1="80" y1="400" x2="82" y2="383" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <!-- Handlebars -->
    <path d="M 68,385 Q 75,377 82,383 Q 89,377 96,385" fill="none" stroke="#546E7A" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Grips -->
    <circle cx="68" cy="386" r="3" fill="#5D4037"/>
    <circle cx="96" cy="386" r="3" fill="#5D4037"/>

    <!-- Pedal crank assembly -->
    <g transform="translate(5, 443)">
      <!-- Chainring -->
      <circle r="11" fill="none" stroke="#546E7A" stroke-width="2"/>
      <circle r="8" fill="none" stroke="#78909C" stroke-width="1"/>
      <!-- Rotating cranks + pedals -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <!-- Crank arms -->
        <line x1="0" y1="-17" x2="0" y2="17" stroke="#546E7A" stroke-width="3.5"/>
        <!-- Right pedal (top at start) -->
        <rect x="-7" y="-21" width="14" height="5" rx="1.5" fill="#455A64"/>
        <!-- Left pedal (bottom at start) -->
        <rect x="-7" y="16" width="14" height="5" rx="1.5" fill="#455A64"/>
      </g>
      <!-- Center bolt -->
      <circle r="3.5" fill="#78909C"/>
    </g>

    <!-- Chain (simplified) -->
    <line x1="16" y1="444" x2="-52" y2="454" stroke="#546E7A" stroke-width="1.5" opacity="0.5"/>
    <line x1="-6" y1="443" x2="-52" y2="454" stroke="#546E7A" stroke-width="1.5" opacity="0.5"/>

    <!-- ========== PELICAN ========== -->

    <!-- Pelican body group with slight bounce -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="0.4s" repeatCount="indefinite"/>

      <!-- Shadow under body on bike -->
      <ellipse cx="-30" cy="370" rx="20" ry="4" fill="#000" opacity="0.1"/>

      <!-- Tail feathers -->
      <path d="M -62,338 Q -80,322 -72,342 Q -68,332 -60,345" fill="#D7CEB2"/>
      <path d="M -58,333 Q -75,320 -68,338" fill="#E0D8C2"/>
      <path d="M -65,342 Q -82,330 -76,348" fill="#CCC4A8"/>

      <!-- Body -->
      <ellipse cx="-28" cy="345" rx="34" ry="24" fill="#F5ECD7" stroke="#DDD5BC" stroke-width="0.8"/>
      <!-- Belly -->
      <ellipse cx="-23" cy="350" rx="22" ry="15" fill="#FBF8F0" opacity="0.5"/>

      <!-- Wing (back, slight flap) -->
      <path d="M -45,330 Q -62,312 -50,305 Q -35,318 -12,325 Q -25,340 -45,330" fill="#E8DFC8" stroke="#DDD5BC" stroke-width="0.5">
        <animate attributeName="d"
          values="M -45,330 Q -62,312 -50,305 Q -35,318 -12,325 Q -25,340 -45,330;
                  M -45,327 Q -68,298 -53,292 Q -35,312 -12,322 Q -25,337 -45,327;
                  M -45,330 Q -62,312 -50,305 Q -35,318 -12,325 Q -25,340 -45,330"
          dur="2s" repeatCount="indefinite"/>
      </path>

      <!-- Neck -->
      <path d="M -2,332 Q 18,300 32,275 Q 40,258 46,248" fill="none" stroke="#F5ECD7" stroke-width="16" stroke-linecap="round"/>
      <path d="M -2,332 Q 18,300 32,275 Q 40,258 46,248" fill="none" stroke="#FBF8F0" stroke-width="9" stroke-linecap="round" opacity="0.35"/>

      <!-- Head -->
      <ellipse cx="50" cy="240" rx="17" ry="15" fill="#F5ECD7" stroke="#DDD5BC" stroke-width="0.5"/>

      <!-- Crest feathers -->
      <path d="M 42,228 Q 38,215 44,220" fill="none" stroke="#E0D8C2" stroke-width="2" stroke-linecap="round"/>
      <path d="M 46,226 Q 44,212 50,218" fill="none" stroke="#DDD5BC" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 50,227 Q 50,214 55,220" fill="none" stroke="#E0D8C2" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Eye white -->
      <ellipse cx="57" cy="235" rx="5" ry="4.5" fill="white"/>
      <!-- Iris -->
      <circle cx="58.5" cy="235" r="2.8" fill="#1A1A1A"/>
      <!-- Eye highlight -->
      <circle cx="59.5" cy="233.5" r="1.2" fill="white"/>
      <!-- Eyebrow line -->
      <path d="M 52,230 Q 57,228 63,230" fill="none" stroke="#8D6E63" stroke-width="1" stroke-linecap="round"/>

      <!-- Upper beak -->
      <path d="M 64,240 L 105,235 Q 108,238 105,242 L 64,247 Z" fill="#FF8F00"/>
      <path d="M 64,240 L 105,235 Q 108,238 105,240 L 64,243 Z" fill="#FFA726" opacity="0.5"/>
      <!-- Beak hook tip -->
      <path d="M 103,235 Q 109,237 105,243" fill="#E65100"/>
      <!-- Nostril -->
      <ellipse cx="80" cy="239" rx="1.5" ry="1" fill="#E65100" opacity="0.5"/>

      <!-- Lower beak / Pouch -->
      <path d="M 64,247 Q 88,275 105,242" fill="#FB8C00" opacity="0.85"/>
      <path d="M 67,249 Q 86,270 100,246" fill="#F57C00" opacity="0.25"/>
      <!-- Pouch texture line -->
      <path d="M 70,252 Q 82,262 95,248" fill="none" stroke="#E65100" stroke-width="0.5" opacity="0.3"/>

      <!-- Little cap -->
      <ellipse cx="48" cy="228" rx="15" ry="4" fill="#1565C0"/>
      <path d="M 36,228 Q 48,214 60,228" fill="#1976D2"/>
      <circle cx="48" cy="214" r="2.5" fill="#FDD835"/>
      <!-- Cap brim -->
      <path d="M 56,230 L 68,228 L 67,231 Z" fill="#0D47A1"/>

      <!-- Scarf -->
      <path d="M 35,260 Q 15,268 -8,258 Q -18,254 -30,262" fill="none" stroke="#C62828" stroke-width="5" stroke-linecap="round">
        <animate attributeName="d"
          values="M 35,260 Q 15,268 -8,258 Q -18,254 -30,262;
                  M 35,260 Q 12,272 -12,262 Q -24,258 -38,268;
                  M 35,260 Q 15,268 -8,258 Q -18,254 -30,262"
          dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M 35,262 Q 18,272 -5,264 Q -15,260 -26,266" fill="none" stroke="#D32F2F" stroke-width="3" stroke-linecap="round" opacity="0.6">
        <animate attributeName="d"
          values="M 35,262 Q 18,272 -5,264 Q -15,260 -26,266;
                  M 35,262 Q 15,276 -9,268 Q -21,264 -34,272;
                  M 35,262 Q 18,272 -5,264 Q -15,260 -26,266"
          dur="1s" repeatCount="indefinite"/>
      </path>

      <!-- Front wing / arm reaching to handlebar -->
      <path d="M 2,335 Q 30,355 68,386" fill="none" stroke="#E8DFC8" stroke-width="9" stroke-linecap="round"/>
      <path d="M 2,335 Q 30,355 68,386" fill="none" stroke="#F5ECD7" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <!-- Wing tip gripping handlebar -->
      <ellipse cx="68" cy="386" rx="5" ry="3.5" fill="#E8DFC8" transform="rotate(-15, 68, 386)"/>

      <!-- Smile line -->
      <path d="M 65,246 Q 70,248 64,249" fill="none" stroke="#E65100" stroke-width="0.5" opacity="0.4"/>
    </g>

    <!-- ========== PELICAN LEGS (outside bounce group, anchored to pedals) ========== -->

    <!-- Right leg (starts top at t=0) -->
    <line stroke="#FF8F00" stroke-width="4" stroke-linecap="round"
          x1="-22" y1="363"
          x2="5" y2="426">
      <animate attributeName="y1" values="363;359;363" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="5;22;5;-12;5" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="426;443;460;443;426" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <!-- Right foot -->
    <ellipse rx="8" ry="3" fill="#FF8F00" transform="rotate(-5)">
      <animate attributeName="cx" values="5;22;5;-12;5" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="426;443;460;443;426" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Left leg (starts bottom at t=0) -->
    <line stroke="#E68A00" stroke-width="4" stroke-linecap="round"
          x1="-18" y1="363"
          x2="5" y2="460">
      <animate attributeName="y1" values="363;359;363" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="5;-12;5;22;5" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="460;443;426;443;460" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <!-- Left foot -->
    <ellipse rx="8" ry="3" fill="#E68A00" transform="rotate(-5)">
