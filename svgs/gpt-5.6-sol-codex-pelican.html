<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --sky-top: #8ed8ff;
      --sky-bottom: #f7efe0;
      --ink: #263747;
      --bike: #e34f42;
      --pelican: #fff9e8;
      --beak: #f6a63b;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--sky-top);
    }

    body {
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
    }

    svg {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .cloud { animation: drift 17s linear infinite; }
    .cloud.slow { animation-duration: 25s; animation-delay: -9s; }
    .cloud.fast { animation-duration: 13s; animation-delay: -5s; }
    .rider { animation: bob 0.68s ease-in-out infinite alternate; transform-origin: 500px 350px; }
    .wheel { animation: spin 0.72s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pedal { animation: spin 0.72s linear infinite; transform-origin: 500px 430px; }
    .front-leg { animation: frontLeg 0.72s ease-in-out infinite alternate; transform-origin: 503px 365px; }
    .back-leg { animation: backLeg 0.72s ease-in-out infinite alternate; transform-origin: 482px 367px; }
    .wing { animation: wing 0.9s ease-in-out infinite alternate; transform-origin: 440px 300px; }
    .crest { animation: crest 0.8s ease-in-out infinite alternate; transform-origin: 419px 197px; }
    .road-stripe { animation: road 1.1s linear infinite; }
    .blink { animation: blink 4.4s infinite; transform-origin: center; }

    @keyframes drift {
      from { transform: translateX(-260px); }
      to { transform: translateX(1250px); }
    }
    @keyframes bob {
      from { transform: translateY(0) rotate(-0.4deg); }
      to { transform: translateY(-6px) rotate(0.6deg); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes frontLeg {
      from { transform: rotate(-13deg); }
      to { transform: rotate(15deg); }
    }
    @keyframes backLeg {
      from { transform: rotate(12deg); }
      to { transform: rotate(-16deg); }
    }
    @keyframes wing {
      from { transform: rotate(-5deg); }
      to { transform: rotate(10deg); }
    }
    @keyframes crest {
      from { transform: rotate(-4deg); }
      to { transform: rotate(5deg); }
    }
    @keyframes road { to { transform: translateX(-180px); } }
    @keyframes blink {
      0%, 46%, 50%, 100% { transform: scaleY(1); }
      48% { transform: scaleY(0.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-play-state: paused !important; }
    }
  </style>
<!-- 内嵌展示适配，兼容直接从本地打开；不改变图形和动画逻辑。 -->
<script>
// 展示适配层：不改 SVG 图形、动画、原按钮或其事件处理。
(()=>{
 if(new URLSearchParams(location.search).get('embed')!=='1')return;
 function fit(){
  const candidates=[...document.querySelectorAll('svg[viewBox]')];
  const art=candidates.sort((a,b)=>{
   const area=s=>{const v=s.viewBox.baseVal;return v.width*v.height};
   return area(b)-area(a);
  })[0];
  if(!art)return;
  const stage=art.closest('#canvasWrapper, #animationContainer, div.scene, .card')||art;
  const controls=document.querySelector('footer:has(button), .footer:has(button), .controls:has(button)');
  const viewport=document.createElement('div');viewport.className='bb-viewport';
  const canvas=document.createElement('div');canvas.className='bb-canvas';
  viewport.append(canvas);canvas.append(stage);
  stage.classList.add('bb-stage');art.classList.add('bb-art');
  art.setAttribute('preserveAspectRatio','xMidYMid meet');
  if(controls){controls.classList.add('bb-controls');viewport.append(controls)}
  document.body.append(viewport);document.documentElement.classList.add('bb-embed');
  const style=document.createElement('style');
  style.textContent=`
   html.bb-embed,html.bb-embed body{width:100%!important;height:100%!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}
   .bb-embed body{display:block!important}
   .bb-embed body>:not(.bb-viewport):not(script):not(style){display:none!important}
   .bb-viewport{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important}
   .bb-canvas{width:100%!important;flex:1!important;min-height:0!important;overflow:hidden!important;display:flex!important;align-items:stretch!important}
   .bb-stage{width:100%!important;height:100%!important;min-height:0!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;aspect-ratio:auto!important;overflow:hidden!important}
   svg.bb-art{display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;flex:1!important}
   .bb-stage .hint{display:none!important}
   .bb-controls{display:flex!important;flex:0 0 auto!important;flex-wrap:wrap!important;align-items:center!important;justify-content:center!important;gap:4px!important;min-width:0!important;max-width:none!important;width:100%!important;margin:0!important;padding:5px 6px!important;border:0!important;border-radius:0!important;box-shadow:none!important;font-size:10px!important;line-height:1.3!important;box-sizing:border-box!important}
   .bb-controls .caption,.bb-controls>div:last-child:has(#cadenceBadge){display:none!important}
   .bb-controls .controls,.bb-controls .button-group,.bb-controls>div{display:flex;align-items:center;gap:4px!important;min-width:0!important}
   .bb-controls .slider-group,.bb-controls>div:has(>input[type=range]){flex:1 1 100%!important;max-width:none!important;min-width:0!important;gap:5px!important}
   .bb-controls button{padding:4px 6px!important;font-size:10px!important;line-height:1.3!important;min-width:0!important;white-space:nowrap!important;border-radius:5px!important}
   .bb-controls label,.bb-controls span{font-size:10px!important;white-space:nowrap!important}
   .bb-controls input[type=range]{width:60px!important;min-width:20px!important;flex:1!important}
   .bb-controls button svg{width:12px!important;height:12px!important;flex:none!important}
  `;
  document.head.append(style);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fit,{once:true});else fit();
})();
</script>
</head>
<body>
  <svg viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
    <title id="title">鹈鹕骑自行车的二维循环动画</title>
    <desc id="desc">一只鹈鹕在海边公路上快乐地骑着红色自行车，车轮、双腿、翅膀和背景持续运动。</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#72caf7" />
        <stop offset="0.67" stop-color="#dff3f1" />
        <stop offset="1" stop-color="#fae2b9" />
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#48b5cf" />
        <stop offset="1" stop-color="#177f9d" />
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffbc4c" />
        <stop offset="1" stop-color="#e67d2f" />
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
        <feGaussianBlur stdDeviation="8" />
      </filter>
      <g id="cloudShape" fill="#fff" opacity=".86">
        <ellipse cx="0" cy="22" rx="62" ry="24" />
        <circle cx="-30" cy="4" r="30" />
        <circle cx="10" cy="-5" r="41" />
        <circle cx="48" cy="10" r="28" />
      </g>
      <g id="wheelShape">
        <circle r="83" fill="#f7fbfb" fill-opacity=".17" stroke="#263747" stroke-width="10" />
        <circle r="70" fill="none" stroke="#fff" stroke-opacity=".48" stroke-width="2" stroke-dasharray="4 8" />
        <g stroke="#506471" stroke-width="2.5">
          <line x1="0" y1="0" x2="0" y2="-76" />
          <line x1="0" y1="0" x2="54" y2="-54" />
          <line x1="0" y1="0" x2="76" y2="0" />
          <line x1="0" y1="0" x2="54" y2="54" />
          <line x1="0" y1="0" x2="0" y2="76" />
          <line x1="0" y1="0" x2="-54" y2="54" />
          <line x1="0" y1="0" x2="-76" y2="0" />
          <line x1="0" y1="0" x2="-54" y2="-54" />
        </g>
        <circle r="9" fill="#263747" />
      </g>
    </defs>

    <rect width="1000" height="620" fill="url(#sky)" />
    <circle cx="835" cy="105" r="52" fill="#ffe38c" opacity=".92" />
    <circle cx="835" cy="105" r="72" fill="#ffe38c" opacity=".18" />

    <g class="cloud" transform="translate(120 105) scale(.8)"><use href="#cloudShape" /></g>
    <g class="cloud slow" transform="translate(470 145) scale(.55)"><use href="#cloudShape" /></g>
    <g class="cloud fast" transform="translate(760 68) scale(.42)"><use href="#cloudShape" /></g>

    <path d="M0 315 Q100 286 202 314 T405 310 T620 306 T820 312 T1000 300 V435 H0Z" fill="url(#sea)" />
    <g fill="none" stroke="#d9fbff" stroke-width="4" opacity=".65">
      <path d="M20 350q30-15 60 0t60 0t60 0" />
      <path d="M720 342q30-15 60 0t60 0t60 0" />
      <path d="M250 384q30-15 60 0t60 0t60 0" />
    </g>
    <path d="M0 397 Q150 370 320 399 T650 394 T1000 390 V465 H0Z" fill="#e8c887" />
    <path d="M0 430 Q185 405 360 432 T720 429 T1000 420 V475 H0Z" fill="#d2a95f" opacity=".55" />

    <rect y="445" width="1000" height="175" fill="#52626a" />
    <rect y="445" width="1000" height="11" fill="#f8e8bd" />
    <rect y="470" width="1000" height="5" fill="#708088" opacity=".65" />
    <g class="road-stripe" fill="#f8df71">
      <rect x="-120" y="552" width="105" height="9" rx="4" />
      <rect x="60" y="552" width="105" height="9" rx="4" />
      <rect x="240" y="552" width="105" height="9" rx="4" />
      <rect x="420" y="552" width="105" height="9" rx="4" />
      <rect x="600" y="552" width="105" height="9" rx="4" />
      <rect x="780" y="552" width="105" height="9" rx="4" />
      <rect x="960" y="552" width="105" height="9" rx="4" />
      <rect x="1140" y="552" width="105" height="9" rx="4" />
    </g>

    <ellipse cx="510" cy="552" rx="250" ry="23" fill="#1e3038" opacity=".25" filter="url(#shadow)" />

    <g class="rider">
      <!-- 自行车轮 -->
      <g class="wheel" transform="translate(345 485)"><use href="#wheelShape" /></g>
      <g class="wheel" transform="translate(666 485)"><use href="#wheelShape" /></g>

      <!-- 自行车架 -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M345 485 L445 360 L500 485 Z M445 360 L585 378 L500 485 L666 485 L585 378" stroke="#e34f42" stroke-width="13" />
        <path d="M585 378 L620 335 L666 485" stroke="#263747" stroke-width="9" />
        <path d="M604 337 L648 332" stroke="#263747" stroke-width="10" />
        <path d="M421 350 L472 350" stroke="#263747" stroke-width="12" />
      </g>
      <circle cx="500" cy="485" r="18" fill="#f6c647" stroke="#263747" stroke-width="6" />
      <g class="pedal">
        <line x1="500" y1="485" x2="538" y2="501" stroke="#263747" stroke-width="7" stroke-linecap="round" />
        <line x1="500" y1="485" x2="462" y2="469" stroke="#263747" stroke-width="7" stroke-linecap="round" />
        <rect x="532" y="497" width="23" height="7" rx="3" fill="#263747" />
        <rect x="445" y="465" width="23" height="7" rx="3" fill="#263747" />
      </g>

      <!-- 腿 -->
      <g class="back-leg" fill="none" stroke="#f3a13b" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
        <path d="M478 365 Q464 418 462 469" />
      </g>
      <g class="front-leg" fill="none" stroke="#ffbd52" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
        <path d="M502 365 Q526 420 538 501" />
      </g>

      <!-- 鹈鹕身体 -->
      <path d="M398 293 C365 335 389 388 453 397 C502 405 535 379 525 338 C516 301 482 275 441 276 C422 276 407 282 398 293Z" fill="var(--pelican)" stroke="#263747" stroke-width="6" />
      <g class="wing">
        <path d="M431 300 C382 315 386 360 430 371 C458 378 486 361 488 332 C465 337 447 326 431 300Z" fill="#e6eef0" stroke="#263747" stroke-width="6" />
        <path d="M409 337 Q443 354 473 333" fill="none" stroke="#b9ccd0" stroke-width="5" stroke-linecap="round" />
      </g>
      <path d="M472 288 C464 253 467 224 442 202 C420 183 382 190 374 217 C364 251 392 276 404 300Z" fill="var(--pelican)" stroke="#263747" stroke-width="6" />

      <!-- 头冠 -->
      <g class="crest" fill="none" stroke="#263747" stroke-width="6" stroke-linecap="round">
        <path d="M404 201 Q397 170 380 167" />
        <path d="M418 196 Q417 162 406 154" />
        <path d="M430 198 Q439 168 432 156" />
      </g>

      <!-- 长嘴与喉囊 -->
      <path d="M389 226 C330 218 245 229 205 253 C258 260 326 263 393 254Z" fill="url(#beak)" stroke="#263747" stroke-width="6" stroke-linejoin="round" />
      <path d="M206 253 C261 269 337 289 394 254 C384 300 311 318 260 291 C236 279 219 266 206 253Z" fill="#f4a544" stroke="#263747" stroke-width="6" stroke-linejoin="round" />
      <path d="M211 253 Q305 251 392 240" fill="none" stroke="#bf6327" stroke-width="3" opacity=".75" />

      <!-- 眼睛 -->
      <g class="blink">
        <circle cx="389" cy="214" r="11" fill="#fff" stroke="#263747" stroke-width="4" />
        <circle cx="386" cy="214" r="4.5" fill="#17242d" />
        <circle cx="384" cy="211" r="1.5" fill="#fff" />
      </g>

      <!-- 扶车把的翅膀 -->
      <path d="M486 320 Q544 306 604 339" fill="none" stroke="#fff9e8" stroke-width="19" stroke-linecap="round" />
      <path d="M486 320 Q544 306 604 339" fill="none" stroke="#263747" stroke-width="6" stroke-linecap="round" />
      <path d="M595 333 q20-5 24 8" fill="none" stroke="#f3a13b" stroke-width="10" stroke-linecap="round" />

      <!-- 尾羽 -->
      <path d="M407 363 Q356 377 329 357 Q364 350 391 331" fill="#dce9eb" stroke="#263747" stroke-width="6" />
    </g>

    <g fill="#fff" opacity=".92">
      <path d="M92 248 q13-16 26 0 q13-16 26 0 q-13-8-26 1 q-13-9-26-1Z" />
      <path d="M822 262 q12-15 24 0 q12-15 24 0 q-12-7-24 1 q-12-8-24-1Z" />
    </g>
  </svg>
</body>
</html>
