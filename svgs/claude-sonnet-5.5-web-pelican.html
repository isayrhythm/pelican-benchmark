<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鹈鹕骑自行车</title>
<style>
  :root { box-sizing: border-box; --sky: #7cc8ee; }
  html, body { height: 100%; margin: 0; background: #5b6470; overflow: hidden; }
  svg#scene { display: block; width: 100%; height: 100%; overflow: visible; }
  .glow { animation: pulse 4s ease-in-out infinite; transform-origin: 640px 90px; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(1.12); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="一只鹈鹕骑着自行车沿海边公路前进的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6bbfec"/>
      <stop offset="1" stop-color="#fde9bf"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9c4"/>
      <stop offset="1" stop-color="#7fd3d6"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="-3000" y="-2000" width="6800" height="2252" fill="url(#sky)"/>
  <circle class="glow" cx="640" cy="90" r="62" fill="#fff3b0"/>
  <circle cx="640" cy="90" r="34" fill="#ffd45e"/>
  <g id="L_clouds"></g>

  <!-- 远山 + 海 -->
  <g id="L_hills"></g>
  <rect x="-3000" y="252" width="6800" height="62" fill="url(#sea)"/>
  <g id="L_shimmer"></g>
  <g id="L_boat"></g>

  <!-- 沙滩 -->
  <rect x="-3000" y="312" width="6800" height="60" fill="#f2dfae"/>
  <rect x="-3000" y="312" width="6800" height="5" fill="#fff6dc" opacity=".8"/>
  <g id="L_palms"></g>

  <!-- 公路 -->
  <rect x="-3000" y="366" width="6800" height="2000" fill="#5b6470"/>
  <rect x="-3000" y="366" width="6800" height="7" fill="#e3dccb"/>
  <g id="L_dash"></g>
  <g id="L_bollard"></g>

  <!-- 影子 -->
  <ellipse id="shadow" cx="400" cy="378" rx="150" ry="9" fill="#000" opacity=".22"/>

  <!-- 骑手整体 -->
  <g id="rig">
    <!-- 远侧腿与脚踏 -->
    <line id="crankF" stroke="#37474f" stroke-width="5" stroke-linecap="round"/>
    <polyline id="legF" fill="none" stroke="#d9742a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footF" d="M-4,-3 L17,0 L15,7 L-4,5 Z" fill="#d9742a" stroke="#8a4a1b" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 后轮 -->
    <g transform="translate(300,320)">
      <g id="wheelR">
        <circle r="54" fill="none" stroke="#263238" stroke-width="7"/>
        <circle r="47" fill="none" stroke="#cfd8dc" stroke-width="2"/>
        <g id="spokesR" stroke="#b0bec5" stroke-width="1.2"></g>
        <circle cx="0" cy="-43" r="3" fill="#e63946"/>
        <circle r="5" fill="#455a64"/>
      </g>
    </g>
    <!-- 前轮 -->
    <g transform="translate(500,320)">
      <g id="wheelF">
        <circle r="54" fill="none" stroke="#263238" stroke-width="7"/>
        <circle r="47" fill="none" stroke="#cfd8dc" stroke-width="2"/>
        <g id="spokesF" stroke="#b0bec5" stroke-width="1.2"></g>
        <circle cx="0" cy="-43" r="3" fill="#e63946"/>
        <circle r="5" fill="#455a64"/>
      </g>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#e4572e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="300" y1="320" x2="385" y2="320"/>      <!-- 后下叉 -->
      <line x1="300" y1="320" x2="348" y2="240"/>      <!-- 后上叉 -->
      <line x1="385" y1="320" x2="348" y2="240"/>      <!-- 座管 -->
      <line x1="348" y1="244" x2="477" y2="244"/>      <!-- 上管 -->
      <line x1="385" y1="320" x2="480" y2="262"/>      <!-- 下管 -->
      <line x1="474" y1="236" x2="480" y2="262"/>      <!-- 头管 -->
      <line x1="480" y1="262" x2="500" y2="320" stroke="#c63f1c"/> <!-- 前叉 -->
    </g>
    <!-- 座杆 + 坐垫 -->
    <line x1="348" y1="240" x2="345" y2="230" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
    <path d="M322,228 Q345,222 366,230 Q345,236 322,228 Z" fill="#263238"/>
    <!-- 把立 + 车把 -->
    <line x1="474" y1="238" x2="478" y2="217" stroke="#37474f" stroke-width="4" stroke-linecap="round"/>
    <path d="M468,215 Q488,212 498,224" fill="none" stroke="#37474f" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 链条盘 -->
    <g transform="translate(385,320)">
      <g id="ring">
        <circle r="15" fill="none" stroke="#78909c" stroke-width="3"/>
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#78909c" stroke-width="2"/>
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#78909c" stroke-width="2"/>
      </g>
      <circle r="5" fill="#37474f"/>
    </g>

    <!-- 近侧腿与脚踏 -->
    <line id="crankN" stroke="#37474f" stroke-width="5" stroke-linecap="round"/>
    <polyline id="legN" fill="none" stroke="#f08a3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footN" d="M-4,-3 L17,0 L15,7 L-4,5 Z" fill="#f08a3c" stroke="#8a4a1b" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 鹈鹕上半身 -->
    <g id="upper">
      <!-- 尾羽 -->
      <path d="M288,198 L238,214 L248,222 L240,232 L292,226 Z" fill="#e8eef1" stroke="#2b3a42" stroke-width="3" stroke-linejoin="round"/>
      <path d="M240,232 L248,222 L238,214 L233,224 Z" fill="#46565e"/>
      <!-- 身体 -->
      <ellipse cx="338" cy="205" rx="60" ry="40" transform="rotate(-12 338 205)" fill="#fff" stroke="#2b3a42" stroke-width="3"/>
      <path d="M300,222 Q340,244 384,214" fill="none" stroke="#dfe7ea" stroke-width="3" stroke-linecap="round"/>

      <!-- 围巾尾巴(飘动) -->
      <path id="scarfTail" fill="#e63946" stroke="#9d1f2b" stroke-width="2" stroke-linejoin="round"/>

      <!-- 脖子 -->
      <path d="M366,186 C402,188 384,150 412,132" fill="none" stroke="#2b3a42" stroke-width="30" stroke-linecap="round"/>
      <path d="M366,186 C402,188 384,150 412,132" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
      <!-- 围巾环 -->
      <path d="M380,168 Q396,176 408,160" fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round"/>

      <!-- 头部 -->
      <g id="head">
        <path d="M410,112 L396,104 L405,118 L392,114 L406,124 Z" fill="#fff" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="418" cy="124" r="17" fill="#fff" stroke="#2b3a42" stroke-width="3"/>
        <!-- 下嘴囊 -->
        <g id="pouch">
          <path d="M430,130 C446,176 524,176 550,141 Z" fill="#ffc27a" stroke="#2b3a42" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M440,140 C462,160 508,160 534,142" fill="none" stroke="#f0974a" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- 上喙 -->
        <path d="M428,115 L548,134 Q556,136 552,142 L548,142 L430,131 Z" fill="#f5b335" stroke="#2b3a42" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M546,134 Q558,134 556,144 L550,142 Z" fill="#e4572e"/>
        <!-- 眼睛 -->
        <circle cx="422" cy="118" r="4.2" fill="#111"/>
        <circle cx="423.4" cy="116.6" r="1.4" fill="#fff"/>
        <path d="M415,111 Q422,108 428,112" fill="none" stroke="#2b3a42" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- 翅膀抓车把 -->
      <path d="M372,182 C406,168 452,194 486,220 L476,236 C446,228 398,238 358,216 Z" fill="#fff" stroke="#2b3a42" stroke-width="3" stroke-linejoin="round"/>
      <path d="M476,236 L486,220 L494,226 L484,240 Z" fill="#46565e" stroke="#2b3a42" stroke-width="2" stroke-linejoin="round"/>
      <path d="M400,200 Q430,206 458,226" fill="none" stroke="#dfe7ea" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g id="L_streaks" opacity=".6"></g>
</svg>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPEED = reduce ? 70 : 240;   // 公路滚动速度 px/s
  var TILE = 800;

  // ---------- 背景图层 ----------
  var layers = [];
  function makeLayer(id, tile, factor) {
    var g = $(id), html = '';
    for (var i = -1; i <= 2; i++) html += '<g transform="translate(' + (i * TILE) + ',0)">' + tile + '</g>';
    g.innerHTML = html;
    layers.push({ el: g, k: factor });
  }
  function wave(base, a1, f1, p1, a2, f2, p2) {
    var d = 'M0,420 ';
    for (var x = 0; x <= TILE; x += 20) {
      var y = base - a1 * Math.sin(2 * Math.PI * x / TILE * f1 + p1) - a2 * Math.sin(2 * Math.PI * x / TILE * f2 + p2);
      d += 'L' + x + ',' + y.toFixed(1) + ' ';
    }
    return d + 'L' + TILE + ',420 Z';
  }
  function cloud(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')" fill="#fff" opacity=".92">' +
      '<ellipse cx="0" cy="0" rx="34" ry="13"/><ellipse cx="-18" cy="-9" rx="20" ry="13"/>' +
      '<ellipse cx="10" cy="-13" rx="22" ry="15"/></g>';
  }
  function palm(x, h, lean) {
    var top = { x: x + lean, y: 345 - h };
    var s = '<path d="M' + x + ',345 Q' + (x + lean * 0.2) + ',' + (345 - h * 0.6) + ' ' + top.x + ',' + top.y +
      '" fill="none" stroke="#8a5a3a" stroke-width="7" stroke-linecap="round"/>';
    var angles = [-160, -125, -90, -55, -20, 15];
    for (var i = 0; i < angles.length; i++) {
      s += '<ellipse cx="' + (top.x + 22) + '" cy="' + top.y + '" rx="24" ry="5.5" fill="' + (i % 2 ? '#2f9a5d' : '#3fb06d') +
        '" transform="rotate(' + angles[i] + ' ' + top.x + ' ' + top.y + ')"/>';
    }
    return s + '<circle cx="' + top.x + '" cy="' + (top.y + 4) + '" r="4" fill="#6b4226"/>';
  }

  makeLayer('L_clouds',
    cloud(110, 70, 1.1) + cloud(330, 120, .8) + cloud(480, 55, 1) + cloud(700, 150, .7), 0.05);
  makeLayer('L_hills',
    '<path d="' + wave(246, 14, 1, 0.6, 7, 3, 1.2) + '" fill="#8fc7ad"/>' +
    '<path d="' + wave(256, 8, 2, 2.0, 5, 5, 0.3) + '" fill="#6fb592"/>', 0.08);
  makeLayer('L_shimmer',
    '<g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55">' +
    '<line x1="70" y1="270" x2="110" y2="270"/><line x1="230" y1="288" x2="290" y2="288"/>' +
    '<line x1="410" y1="266" x2="440" y2="266"/><line x1="560" y1="296" x2="620" y2="296"/>' +
    '<line x1="700" y1="276" x2="740" y2="276"/><line x1="150" y1="302" x2="190" y2="302"/></g>', 0.12);
  makeLayer('L_boat',
    '<g transform="translate(520,266)"><path d="M-22,0 L22,0 L16,9 L-16,9 Z" fill="#c9553a"/>' +
    '<line x1="0" y1="0" x2="0" y2="-34" stroke="#5a4636" stroke-width="2"/>' +
    '<path d="M2,-34 L2,-4 L24,-4 Z" fill="#fff"/><path d="M-2,-28 L-2,-4 L-16,-4 Z" fill="#ffe9a8"/></g>', 0.06);
  makeLayer('L_palms',
    palm(70, 78, 14) + palm(260, 64, -10) + palm(450, 86, 16) + palm(640, 70, -12), 0.4);
  makeLayer('L_dash',
    '<g fill="#f6efe0"><rect x="20" y="414" width="70" height="7" rx="3"/><rect x="220" y="414" width="70" height="7" rx="3"/>' +
    '<rect x="420" y="414" width="70" height="7" rx="3"/><rect x="620" y="414" width="70" height="7" rx="3"/></g>', 1);
  makeLayer('L_bollard',
    '<g><rect x="150" y="350" width="9" height="20" rx="3" fill="#e63946"/><rect x="150" y="355" width="9" height="4" fill="#fff"/>' +
    '<rect x="550" y="350" width="9" height="20" rx="3" fill="#e63946"/><rect x="550" y="355" width="9" height="4" fill="#fff"/></g>', 1);
  makeLayer('L_streaks',
    '<g stroke="#fff" stroke-width="3" stroke-linecap="round">' +
    '<line x1="40" y1="170" x2="100" y2="170"/><line x1="300" y1="130" x2="380" y2="130"/>' +
    '<line x1="520" y1="200" x2="590" y2="200"/><line x1="680" y1="260" x2="760" y2="260"/>' +
    '<line x1="160" y1="300" x2="230" y2="300"/><line x1="420" y1="270" x2="480" y2="270"/></g>', 1.7);

  // ---------- 辐条 ----------
  ['spokesR', 'spokesF'].forEach(function (id) {
    var h = '';
    for (var i = 0; i < 16; i++) {
      var a = i * 360 / 16;
      h += '<line x1="0" y1="-6" x2="0" y2="-47" transform="rotate(' + a + ')"/>';
    }
    $(id).innerHTML = h;
  });

  // ---------- 动画主循环 ----------
  var BB = { x: 385, y: 320 }, HIP = { x: 340, y: 224 }, L = 72, CR = 28, WR = 55;
  var rig = $('rig'), upper = $('upper'), head = $('head'), pouch = $('pouch');
  var wheelR = $('wheelR'), wheelF = $('wheelF'), ring = $('ring');
  var legN = $('legN'), legF = $('legF'), footN = $('footN'), footF = $('footF');
  var crankN = $('crankN'), crankF = $('crankF'), scarf = $('scarfTail');
  var shadow = $('shadow');

  function knee(h, f) {
    var dx = f.x - h.x, dy = f.y - h.y, d = Math.min(Math.hypot(dx, dy), 2 * L - 0.1);
    var ux = dx / d, uy = dy / d, hh = Math.sqrt(L * L - d * d / 4);
    return { x: (h.x + f.x) / 2 + uy * hh, y: (h.y + f.y) / 2 - ux * hh };
  }
  function setLeg(poly, foot, crank, a, hip) {
    var f = { x: BB.x + CR * Math.cos(a), y: BB.y + CR * Math.sin(a) };
    var k = knee(hip, f);
    poly.setAttribute('points', hip.x + ',' + hip.y + ' ' + k.x.toFixed(1) + ',' + k.y.toFixed(1) + ' ' + f.x.toFixed(1) + ',' + f.y.toFixed(1));
    foot.setAttribute('transform', 'translate(' + (f.x - 4).toFixed(1) + ',' + (f.y + 1).toFixed(1) + ')');
    crank.setAttribute('x1', BB.x); crank.setAttribute('y1', BB.y);
    crank.setAttribute('x2', f.x.toFixed(1)); crank.setAttribute('y2', f.y.toFixed(1));
  }

  var s = 0, last = null, paused = false;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    if (paused) return;
    s += SPEED * dt;
    var t = ts / 1000;

    // 背景滚动
    for (var i = 0; i < layers.length; i++) {
      layers[i].el.setAttribute('transform', 'translate(' + (-((s * layers[i].k) % TILE)).toFixed(2) + ',0)');
    }

    // 轮子与曲柄
    var wDeg = (s / WR) * 180 / Math.PI;
    wheelR.setAttribute('transform', 'rotate(' + wDeg.toFixed(2) + ')');
    wheelF.setAttribute('transform', 'rotate(' + wDeg.toFixed(2) + ')');
    var a = (s / WR) * 0.72;
    ring.setAttribute('transform', 'rotate(' + (a * 180 / Math.PI).toFixed(2) + ')');

    // 车身颠簸 + 蹬踏起伏
    var bump = Math.sin(t * 9) * 0.8;
    var ub = Math.sin(a * 2) * 1.8;
    rig.setAttribute('transform', 'translate(0,' + bump.toFixed(2) + ')');
    upper.setAttribute('transform', 'translate(0,' + ub.toFixed(2) + ')');
    shadow.setAttribute('rx', (150 + Math.sin(t * 9) * 2).toFixed(1));

    // 腿
    var hip = { x: HIP.x, y: HIP.y + ub };
    setLeg(legN, footN, crankN, a, hip);
    setLeg(legF, footF, crankF, a + Math.PI, hip);

    // 头与嘴囊
    head.setAttribute('transform', 'rotate(' + (Math.sin(t * 4.2) * 1.6).toFixed(2) + ' 400 150)');
    pouch.setAttribute('transform', 'rotate(' + (Math.sin(t * 6.5 + 1) * 2.5).toFixed(2) + ' 432 128)');

    // 围巾飘动
    var w1 = Math.sin(t * 9) * 5, w2 = Math.sin(t * 9 + 1.1) * 8, w3 = Math.sin(t * 9 + 2.2) * 11;
    scarf.setAttribute('d',
      'M392,162 C366,' + (158 + w1).toFixed(1) + ' 340,' + (166 + w2).toFixed(1) + ' 306,' + (164 + w3).toFixed(1) +
      ' L300,' + (178 + w3).toFixed(1) +
      ' C340,' + (182 + w2).toFixed(1) + ' 366,' + (176 + w1).toFixed(1) + ' 394,176 Z');
  }
  requestAnimationFrame(frame);

  document.getElementById('scene').addEventListener('click', function () { paused = !paused; });
})();
</script>
</body>
</html>
