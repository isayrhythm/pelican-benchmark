<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 700px at 50% 12%, #12294d 0%, #081326 55%, #04070f 100%);
    display:flex;align-items:center;justify-content:center;
    padding:22px;box-sizing:border-box;
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .card{
    width:min(1120px,100%);
    border-radius:22px;
    overflow:hidden;
    background:#0d1b2e;
    box-shadow:0 30px 70px rgba(0,0,0,.68), 0 0 0 1px rgba(146,196,255,.18);
    position:relative;
  }
  svg.scene{display:block;width:100%;height:auto;background:#9fe0f8;}
  .hint{
    position:absolute;left:0;right:0;bottom:10px;text-align:center;
    color:#dcefff;font-size:13px;letter-spacing:.14em;
    text-shadow:0 2px 6px rgba(0,0,0,.55);
    pointer-events:none;opacity:.85;
  }
  @keyframes drift{ from{transform:translateX(0)} to{transform:translateX(-130px)} }
  @keyframes drift2{ from{transform:translateX(0)} to{transform:translateX(-200px)} }
  @keyframes spin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes blink{ 0%,90%,100%{transform:scaleY(1)} 94%{transform:scaleY(.12)} }
  @keyframes puff{ from{transform:translateX(0)} to{transform:translateX(90px)} }
</style>
<script src="../embed.js" defer></script>
</head>
<body>
<div class="card">

    <radialGradient id="bodyGrad" cx="42%" cy="32%" r="72%">

      <stop offset="1"   stop-color="#cfdae7"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">

</svg>
<div class="hint">鹈鹕 × 自行车 · 纯 SVG + 原生动画</div>
</div>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent){
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  /* ---------- 几何常量 ---------- */
  var REAR  = {x:320,  y:400, r:62};
  var FRONT = {x:600,  y:400, r:62};
  var BB    = {x:450,  y:395};
  var COG   = {x:320,  y:400, r:13};
  var RING  = {x:450,  y:395, r:24};
  var CRANK = 34;
  var KNEE_OFFSET = 1;          // 膝盖弯曲方向：1 = 向前（人腿）
  var HIP = {x:430, y:262};
  var THIGH = 110, SHIN = 110;
  var GEAR = 2;                 // 车轮 : 曲柄
  var WHEEL_DEG_PER_SEC = 92;

  /* ---------- 车轮静态结构 ---------- */
  function spokeLines(cx, cy, r1, r2, n){
    var d = "", i, a;
    for (i=0;i<n;i++){
      a = (i/n) * Math.PI * 2;
      d += "M" + (cx + Math.cos(a)*r1).toFixed(1) + " " + (cy + Math.sin(a)*r1).toFixed(1) +
           " L" + (cx + Math.cos(a)*r2).toFixed(1) + " " + (cy + Math.sin(a)*r2).toFixed(1) + " ";
    }
    return d;
  }
  function renderWheel(groupId, c){
    var g = document.getElementById(groupId);
    g.appendChild(el("circle", {cx:c.x, cy:c.y, r:c.r,      fill:"none", stroke:"#22252b", "stroke-width":11}));
    g.appendChild(el("circle", {cx:c.x, cy:c.y, r:c.r-9,    fill:"none", stroke:"#c3cad3", "stroke-width":4}));
    var spokes = el("g", {id: groupId + "Spokes", stroke:"#e2e8ef", "stroke-width":2.2, "stroke-linecap":"round"}, g);
    spokes.appendChild(el("path", {d: spokeLines(c.x, c.y, 7, c.r-12, 18), fill:"none"}));
    g.appendChild(el("circle", {cx:c.x, cy:c.y, r:6.5, fill:"#9aa4b0", stroke:"#5f6873", "stroke-width":2}));
  }
  renderWheel("wheelRear",  REAR);
  renderWheel("wheelFront", FRONT);

  /* ---------- 齿 / 链条 ---------- */
  (function buildTeeth(){
    var rt = document.getElementById("ringTeeth"), i, a, r1 = RING.r, r2 = RING.r + 4;
    for (i=0;i<18;i++){
      a = i/18*Math.PI*2;
      rt.appendChild(el("line", {
        x1:(RING.x+Math.cos(a)*r1).toFixed(1), y1:(RING.y+Math.sin(a)*r1).toFixed(1),
        x2:(RING.x+Math.cos(a)*r2).toFixed(1), y2:(RING.y+Math.sin(a)*r2).toFixed(1)}));
    }
    var ct = document.getElementById("cogTeeth"), rr1 = COG.r, rr2 = COG.r + 3;
    for (i=0;i<12;i++){
      a = i/12*Math.PI*2;
      ct.appendChild(el("line", {
        x1:(COG.x+Math.cos(a)*rr1).toFixed(1), y1:(COG.y+Math.sin(a)*rr1).toFixed(1),
        x2:(COG.x+Math.cos(a)*rr2).toFixed(1), y2:(COG.y+Math.sin(a)*rr2).toFixed(1)}));
    }
    /* 链条：两个多边形（外切线 + 内切线）围成的闭合环 */
    var dx = COG.x - RING.x, dy = COG.y - RING.y;
    var D = Math.sqrt(dx*dx + dy*dy);
    var alpha = Math.acos((RING.r - COG.r) / D);
    var th = Math.atan2(dy, dx);

    var aT1 = th + alpha, aT2 = th - alpha;
    var aC1 = (th + Math.PI) + alpha;
    var aC2 = (th + Math.PI) - alpha;

    var rt1 = {x: RING.x + RING.r*Math.cos(aT1), y: RING.y + RING.r*Math.sin(aT1)};
    var rt2 = {x: RING.x + RING.r*Math.cos(aT2), y: RING.y + RING.r*Math.sin(aT2)};
    var ct1 = {x: COG.x + COG.r*Math.cos(aC1), y: COG.y + COG.r*Math.sin(aC1)};
    var ct2 = {x: COG.x + COG.r*Math.cos(aC2), y: COG.y + COG.r*Math.sin(aC2)};
    var sweep = (aC1 - aT1) > 0 ? 1 : 0;

    var p = "M" + rt1.x.toFixed(1) + " " + rt1.y.toFixed(1) +
            " L" + ct1.x.toFixed(1) + " " + ct1.y.toFixed(1) +
            " A" + COG.r + " " + COG.r + " 0 0 " + sweep + " " + ct2.x.toFixed(1) + " " + ct2.y.toFixed(1) +
            " L" + rt2.x.toFixed(1) + " " + rt2.y.toFixed(1) +
            " A" + RING.r + " " + RING.r + " 0 0 " + (sweep ? 0 : 1) + " " + rt1.x.toFixed(1) + " " + rt1.y.toFixed(1) + " Z";
    document.getElementById("chainPath").setAttribute("d", p);
  })();

  /* ---------- 地面虚线（程序生成） ---------- */
  var dashes = [];
  (function buildDashes(){
    var g = document.getElementById("groundDashes");
    for (var i=0;i<16;i++){
      var x = i*78 + Math.random()*26;
      var w = 34 + Math.random()*26;
      var h = 4 + Math.random()*3;
      var y = 434 + Math.random()*30;
      var d = el("rect", {x:x.toFixed(1), y:y.toFixed(1), width:w.toFixed(1), height:h.toFixed(1), rx:2, fill:"#c8c3bb", opacity:(0.35+Math.random()*0.4).toFixed(2)}, g);
      dashes.push({n:d, x:x, w:w, sp:180 + Math.random()*110});
    }
  })();

  /* ---------- 速度线 ---------- */
  var lines = [];
  (function buildSpeedLines(){
    var g = document.getElementById("speedLines");
    for (var i=0;i<11;i++){
      var y = 180 + Math.random()*230;
      var len = 46 + Math.random()*90;
      var x = Math.random()*1120;
      var n = el("line", {x1:x.toFixed(1), y1:y.toFixed(1), x2:(x+len).toFixed(1), y2:y.toFixed(1),
                           "stroke-width":(1.6+Math.random()*2.4).toFixed(1), opacity:"0"}, g);
      lines.push({n:n, x:x, len:len, sp:520 + Math.random()*380});
    }
  })();

  /* ---------- 翅膀/尾部气流 ---------- */
  var dusts = [];
  (function buildDust(){
    var g = document.getElementById("dust");
    for (var i=0;i<9;i++){
      var x = 220 - Math.random()*120, y = 200 + Math.random()*180;
      var r = 6 + Math.random()*13;
      var n = el("circle", {cx:x.toFixed(1), cy:y.toFixed(1), r:r.toFixed(1), fill:"#ffffff", opacity:"0"}, g);
      dusts.push({n:n, x:x, y:y, r:r, sp:120 + Math.random()*160});
    }
  })();

  /* ---------- 腿（解析 IK） ---------- */
  function solveKnee(foot, bend){
    var vx = foot.x - HIP.x, vy = foot.y - HIP.y;
    var dist = Math.sqrt(vx*vx + vy*vy);
    var maxLen = THIGH + SHIN - 0.5;
    if (dist > maxLen){
      var s = maxLen / dist;
      vx *= s; vy *= s; dist = maxLen;
      foot = {x: HIP.x + vx, y: HIP.y + vy};
    }
    if (dist < 1e-3) dist = 1e-3;
    var a = Math.atan2(vy, vx);
    var c = Math.min(1, Math.max(-1, (THIGH*THIGH + dist*dist - SHIN*SHIN) / (2*THIGH*dist)));
    var ang = Math.acos(c);
    var ka = a + bend*ang;
    return {knee:{x: HIP.x + THIGH*Math.cos(ka), y: HIP.y + THIGH*Math.sin(ka)}, foot:foot};
  }
  function drawLeg(groupId, prev){
    var g = document.getElementById(groupId);
    var frag = document.createDocumentFragment();
    var col = "#ff9d3f", dark = "#d9781b";
    frag.appendChild(el("line", {x1:HIP.x, y1:HIP.y, x2:prev.knee.x.toFixed(1), y2:prev.knee.y.toFixed(1),
      stroke:col, "stroke-width":17, "stroke-linecap":"round"}));
    frag.appendChild(el("line", {x1:prev.knee.x.toFixed(1), y1:prev.knee.y.toFixed(1), x2:prev.foot.x.toFixed(1), y2:prev.foot.y.toFixed(1),
      stroke:col, "stroke-width":13, "stroke-linecap":"round"}));
    frag.appendChild(el("circle", {cx:HIP.x, cy:HIP.y, r:11, fill:col}));
    frag.appendChild(el("circle", {cx:prev.knee.x.toFixed(1), cy:prev.knee.y.toFixed(1), r:8.5, fill:col}));
    var ang = Math.atan2(prev.foot.y - prev.knee.y, prev.foot.x - prev.knee.x) * 180 / Math.PI;
    var fg = el("g", {transform:"translate(" + prev.foot.x.toFixed(1) + "," + prev.foot.y.toFixed(1) + ") rotate(" + ang.toFixed(1) + ")"});
    fg.appendChild(el("path", {d:"M-10 4 L26 2 L25 10 L-9 11 Z", fill:dark}));
    frag.appendChild(fg);
    while (g.firstChild) g.removeChild(g.firstChild);
    g.appendChild(frag);
  }

  /* ---------- 动画主循环 ---------- */
  var spokeR = document.getElementById("wheelRearSpokes");
  var spokeF = document.getElementById("wheelFrontSpokes");
  var crankArm  = document.getElementById("crankArm");
  var crankFar  = document.getElementById("crankFarArm");
  var footNearG = document.getElementById("footNearG");
  var footNearB = document.getElementById("footNearBody");
  var footFarG  = document.getElementById("footFarG");
  var footFarB  = document.getElementById("footFarBody");
  var pelican   = document.getElementById("pelicanBob");
  var chain     = document.getElementById("chainPath");
  var last = null, wheelPhase = 0;

  function frame(now){
    if (last === null) last = now;
    var dt = (now - last) / 1000;
    if (dt > 0.05) dt = 0.05;
    last = now;

    wheelPhase += WHEEL_DEG_PER_SEC * dt;
    if (wheelPhase > 1e6) wheelPhase -= 1e6;
    var th = wheelPhase * Math.PI / 180;              // 车轮角
    var cb = th / GEAR + Math.PI;                     // 曲柄角（近侧脚在最低点起算）

    /* 车轮 */
    spokeR.setAttribute("transform", "rotate(" + wheelPhase.toFixed(2) + " " + REAR.x + " " + REAR.y + ")");
    spokeF.setAttribute("transform", "rotate(" + wheelPhase.toFixed(2) + " " + FRONT.x + " " + FRONT.y + ")");

    /* 脚踏位置 */
    var nf = {x: BB.x + CRANK*Math.cos(cb),               y: BB.y + CRANK*Math.sin(cb)};
    var ff = {x: BB.x - CRANK*Math.cos(cb),               y: BB.y - CRANK*Math.sin(cb)};

    crankArm.setAttribute("x2", nf.x.toFixed(1));
    crankArm.setAttribute("y2", nf.y.toFixed(1));
    crankFar.setAttribute("x2", ff.x.toFixed(1));
    crankFar.setAttribute("y2", ff.y.toFixed(1));

    footNearB.setAttribute("transform", "rotate(" + (cb*180/Math.PI).toFixed(1) + ")");
    footNearG.setAttribute("transform", "translate(" + nf.x.toFixed(1) + "," + nf.y.toFixed(1) + ")");
    footFarB.setAttribute("transform", "rotate(" + (cb*180/Math.PI).toFixed(1) + ")");
    footFarG.setAttribute("transform", "translate(" + ff.x.toFixed(1) + "," + ff.y.toFixed(1) + ")");

    /* 双腿 */
    drawLeg("legNear", solveKnee(nf, KNEE_OFFSET));
    drawLeg("legFar",  solveKnee(ff, KNEE_OFFSET));

    /* 链条流动 */
    chain.setAttribute("stroke-dasharray", "7 4");
    chain.setAttribute("stroke-dashoffset", (-(wheelPhase * 2.2) % 11).toFixed(2));

    /* 身体上下起伏 / 轻微摇摆（曲柄两圈一循环） */
    var bobY  = Math.sin(cb * 2) * 3.4;
    var lean  = Math.sin(cb) * 1.7;
    pelican.setAttribute("transform",
      "rotate(" + lean.toFixed(2) + " 404 244) translate(0 " + bobY.toFixed(2) + ")");

    /* 路面虚线滚动 */
    for (var i=0;i<dashes.length;i++){
      var d = dashes[i];
      d.x -= d.sp * dt;
      if (d.x < -80) d.x += 1180;
      d.n.setAttribute("x", d.x.toFixed(1));
    }
    /* 速度线 */
    for (var j=0;j<lines.length;j++){
      var L = lines[j];
      L.x -= L.sp * dt;
      if (L.x < -160){ L.x = 1120 + Math.random()*160; L.n.setAttribute("y1", (180+Math.random()*230).toFixed(1)); L.n.setAttribute("y2", L.n.getAttribute("y1")); }
      L.n.setAttribute("x1", L.x.toFixed(1));
      L.n.setAttribute("x2", (L.x + L.len).toFixed(1));
      var o = L.x > 900 ? (1120 - L.x) / 220 : (L.x < 260 ? Math.max(0, L.x) / 260 : 1);
      L.n.setAttribute("opacity", (o * 0.55).toFixed(2));
    }
    /* 尾部气流 */
    for (var k=0;k<dusts.length;k++){
      var P = dusts[k];
      P.x -= P.sp * dt;
      if (P.x < -40){ P.x = 260 + Math.random()*120; P.y = 190 + Math.random()*190; }
      P.n.setAttribute("cx", P.x.toFixed(1));
      var po = P.x > 240 ? 0 : Math.min(1, (240 - P.x) / 120);
      P.n.setAttribute("opacity", (po * 0.5).toFixed(2));
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
