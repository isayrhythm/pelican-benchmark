<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelican, pedaling</title>
<style>
:root{color-scheme:light;--ink:#234e51}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f5f2e9;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:clamp(18px,4vw,56px)}main{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:end;padding:0 4px 24px;gap:20px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.23em;text-transform:uppercase;margin:0 0 12px;color:#537774}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(31px,5vw,57px);line-height:1;margin:0;letter-spacing:-.035em}.tag{font-family:Georgia,serif;font-style:italic;font-size:18px;margin:0 0 4px;white-space:nowrap;color:#617c77}.scene{position:relative;border-radius:22px;overflow:hidden;background:#d9ece4;box-shadow:0 20px 60px #214c4610;border:1px solid #234e5110}.scene svg{display:block;width:100%;height:auto}.footer{display:flex;align-items:center;justify-content:space-between;padding:19px 4px 0;gap:16px}.caption{font-size:12px;color:#6b8078;letter-spacing:.025em}.controls{display:flex;align-items:center;gap:14px}button{font:600 12px inherit;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);border:1px solid #b9cbc1;background:transparent;padding:9px 15px;border-radius:99px;cursor:pointer;min-width:93px}button:hover{background:#e4ece3}button:focus-visible{outline:3px solid #ec9862;outline-offset:3px}.live{font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:7px}.live:before{content:"";width:5px;height:5px;background:#5f9580;border-radius:50%}@media(max-width:600px){.tag{display:none}header{padding-bottom:20px}.caption{max-width:180px;line-height:1.5}.live{display:none}.scene{border-radius:16px}}@media(prefers-reduced-motion:reduce){.live:before{background:#b19b6f}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">A little seaside loop · No. 01</p><h1>Taking the scenic route.</h1></div><p class="tag">Nowhere to be. All day to get there.</p></header>
<div class="scene">

<g id="dunes"><path d="M-1100 433Q-850 359-584 426T0 433Q250 359 516 426T1100 433Q1350 359 1616 426T2200 433V660H-1100Z" fill="#e0daba"/><path d="M-1100 469Q-813 407-550 463T0 469Q287 407 550 463T1100 469Q1387 407 1650 463T2200 469V660H-1100Z" fill="#eae1c2"/></g>
<g id="backGrass"><use href="#grass" x="105" y="453"/><use href="#grass" x="957" y="445"/><use href="#grass" x="1290" y="445"/><use href="#grass" x="-200" y="445"/></g>
<path d="M0 526Q550 507 1100 526V660H0Z" fill="#f2e9ce"/><path d="M0 526Q550 507 1100 526" fill="none" stroke="#d3cfad" stroke-width="2"/>
<rect y="532" width="1100" height="128" fill="url(#grit)"/>

<ellipse cx="543" cy="553" rx="217" ry="15" fill="#8c9d7b" opacity=".15"/>

<g stroke="#db7860" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M390 467L473 365 537 467H390M473 365H659L537 467M643 324L701 467"/></g>
<path d="M473 365L462 341" stroke="#32595a" stroke-width="7" stroke-linecap="round"/>
<path d="M441 339Q465 333 486 339Q491 346 479 349H442Q433 346 441 339" fill="#305354"/>
<path d="M643 324L633 295Q659 297 667 282Q673 270 658 265" fill="none" stroke="#436662" stroke-width="6" stroke-linecap="round"/><path d="M658 265L645 265" fill="none" stroke="#2e4e4d" stroke-width="10" stroke-linecap="round"/>
<path d="M312 443A82 82 0 0 1 455 405M644 405A83 83 0 0 1 780 442" fill="none" stroke="#f5ba83" stroke-width="6" stroke-linecap="round"/>
<circle cx="537" cy="467" r="23" fill="#efd7ad" stroke="#385c57" stroke-width="4"/><circle cx="537" cy="467" r="15" fill="none" stroke="#d2ba91" stroke-width="2"/>
<g id="crank" stroke="#365c56" stroke-width="6" stroke-linecap="round"><path d="M507 467H567"/><circle cx="537" cy="467" r="5" fill="#f4e6c9" stroke-width="2"/></g>

<g id="frontGrass"><use href="#grass" transform="translate(68 639) scale(1.2)"/><use href="#grass" transform="translate(971 653) scale(1.6)"/><use href="#grass" transform="translate(1330 640) scale(1.3)"/><path d="M820 628q9-6 19 0m-732-25q6-5 12 0" fill="none" stroke="#adad87" stroke-width="2" stroke-linecap="round"/></g>

</div>
<div class="footer"><span class="caption">A salty breeze. A steady cadence. A very good day.</span><div class="controls"><span class="live" id="status">On the move</span><button type="button" id="toggle" aria-label="Pause animation">Ⅱ Pause</button></div></div>
</main>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id), reduced=matchMedia('(prefers-reduced-motion: reduce)');
let playing=!reduced.matches,time=0,last=null;
const toggle=el('toggle');
function sync(){toggle.textContent=playing?'Ⅱ Pause':'▷ Play';toggle.setAttribute('aria-label',playing?'Pause animation':'Play animation');el('status').textContent=playing?'On the move':'Enjoy the view'}
toggle.addEventListener('click',()=>{playing=!playing;last=null;sync()});
function leg(id,hip,foot,bend){const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.hypot(dx,dy),a=84,b=84,along=(a*a-b*b+d*d)/(2*d),height=Math.sqrt(Math.max(0,a*a-along*along));const knee={x:hip.x+along*dx/d+bend*height*dy/d,y:hip.y+along*dy/d-bend*height*dx/d};el(id).setAttribute('d',`M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`)}
function draw(t){const angle=t*2.65,deg=angle*180/Math.PI,bob=Math.sin(angle*2)*1.35;el('rider').setAttribute('transform',`translate(0 ${bob})`);['rearWheel','frontWheel'].forEach(id=>el(id).setAttribute('transform',`rotate(${deg*1.45})`));el('crank').setAttribute('transform',`rotate(${deg} 537 467)`);
const near={x:537+30*Math.cos(angle),y:467+30*Math.sin(angle)},far={x:537-30*Math.cos(angle),y:467-30*Math.sin(angle)};
leg('nearLeg',{x:511,y:338},near,1);leg('farLeg',{x:499,y:341},far,1);
[['nearFoot',near],['farFoot',far]].forEach(([id,p])=>el(id).setAttribute('transform',`translate(${p.x} ${p.y-7})`));[['pedalNear',near],['pedalFar',far]].forEach(([id,p])=>el(id).setAttribute('transform',`translate(${p.x} ${p.y+2})`));
el('roadMarks').setAttribute('transform',`translate(${-t*115%264} 0)`);el('dunes').setAttribute('transform',`translate(${-t*12%1100} 0)`);el('backGrass').setAttribute('transform',`translate(${-t*29%1185} 0)`);el('frontGrass').setAttribute('transform',`translate(${-t*115%1262} 0)`);el('clouds').setAttribute('transform',`translate(${Math.sin(t*.035)*24} 0)`);el('waves').setAttribute('transform',`translate(${Math.sin(t*.3)*8} 0)`);el('scarf').setAttribute('transform',`rotate(${Math.sin(t*7)*3} 568 222)`)}
function frame(now){if(last!==null&&playing)time+=Math.min((now-last)/1000,.05);last=now;draw(time);requestAnimationFrame(frame)}
sync();draw(0);requestAnimationFrame(frame);
})();
</script>
</body></html>
