<title>鹈鹕骑自行车</title>
<style>
  :root {
    --ink: #20312d;
    --cream: #fff8e9;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background:
      radial-gradient(110% 90% at 72% 0%, rgba(255, 242, 207, 0.55) 0%, rgba(255, 242, 207, 0) 55%),
      linear-gradient(180deg, #c7e7f1 0%, #e6f1e6 38%, #b7d1b7 55%, #8fb587 67%, #74766e 84%, #525750 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    min-height: 300px;
  }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  #toggle {
    position: absolute;
    right: clamp(16px, 3vw, 42px);
    bottom: clamp(16px, 3vw, 36px);
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 17px 10px 13px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    background: rgba(30, 52, 47, 0.72);
    color: var(--cream);
    font: 600 13px/1 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    letter-spacing: 0.05em;
    cursor: pointer;
    z-index: 5;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 26px rgba(29, 46, 41, 0.2);
    transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
  }

  #toggle:hover {
    background: rgba(30, 52, 47, 0.88);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(29, 46, 41, 0.24);
  }

  #toggle:active { transform: translateY(0) scale(0.98); }

  #toggle:focus-visible {
    outline: 3px solid #fff0b7;
    outline-offset: 3px;
  }

  #toggle .icon {
    display: inline-flex;
    width: 16px;
    height: 16px;
  }

  #toggle svg {
    display: block;
    width: 16px;
    height: 16px;
  }

  @media (max-width: 560px) {
    #toggle {
      right: 14px;
      bottom: 14px;
      padding: 9px 14px 9px 11px;
      font-size: 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #toggle { transition: none; }
  }
</style>
</head>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  const refs = {
    rearWheel: $("rearWheelSpin"),
    frontWheel: $("frontWheelSpin"),
    farArm: $("farArm"),
    farPedal: $("farPedalGroup"),
    farThigh: $("farThigh"),
    farShin: $("farShin"),
    farKnee: $("farKnee"),
    farFoot: $("farFoot"),
    nearArm: $("nearArm"),
    nearPedal: $("nearPedalGroup"),
    nearThigh: $("nearThigh"),
    nearShin: $("nearShin"),
    nearKnee: $("nearKnee"),
    nearFoot: $("nearFoot"),
    chainDots: $("chainDots"),
    chainring: $("chainringSpin"),
    bodyGroup: $("bodyGroup"),
    headGroup: $("headGroup"),
    tailGroup: $("tailGroup"),
    scarfMain: $("scarfMain"),
    scarfBack: $("scarfBack"),
    eyeOpen: $("eyeOpen"),
    eyeClosed: $("eyeClosed"),
    farTreesWrap: $("farTreesWrap"),
    nearFenceWrap: $("nearFenceWrap"),
    roadDash: $("roadDash"),
    birds: $("birds"),
    toggle: $("toggle"),
    toggleLabel: $("toggleLabel"),
    dust: [$("dust1"), $("dust2"), $("dust3")],
    clouds: [
      { el: $("cloud1"), x: 92, y: 94, scale: 0.95, speed: 7.0, sway: 2.0 },
      { el: $("cloud2"), x: 560, y: 64, scale: 0.63, speed: 4.5, sway: 1.4 },
      { el: $("cloud3"), x: 1044, y: 226, scale: 0.8, speed: 5.6, sway: 1.8 },
      { el: $("cloud4"), x: 354, y: 214, scale: 0.48, speed: 3.4, sway: 1.2 }
    ]
  };

  const state = {
    t: 0,
    wheel: 0,
    crank: 0,
    paused: false,
    last: 0
  };

  const WHEEL_RATE = 470;
  const CRANK_RATE = 240;
  const BB = { x: 580, y: 548 };
  const PEDAL_RADIUS = 46;

  const f = (n) => n.toFixed(1);
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  state.paused = reducedMotion.matches;

  const pauseIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2.5" width="3.4" height="11" rx="1.2" fill="currentColor"/><rect x="9.6" y="2.5" width="3.4" height="11" rx="1.2" fill="currentColor"/></svg>';
  const playIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 2.5v11L13.4 8Z" fill="currentColor"/></svg>';

  function updateToggle() {
    refs.toggle.setAttribute("aria-pressed", String(state.paused));
    refs.toggle.setAttribute("aria-label", state.paused ? "播放动画" : "暂停动画");
    refs.toggleLabel.textContent = state.paused ? "播放" : "暂停";
    const iconSlot = refs.toggle.querySelector(".icon");
    if (iconSlot) iconSlot.innerHTML = state.paused ? playIcon : pauseIcon;
  }

  function setPaused(paused) {
    state.paused = paused;
    state.last = performance.now();
    updateToggle();
  }

  function solveKnee(hip, ankle, l1, l2) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const reach = Math.min(distance, l1 + l2 - 0.5);
    const base = Math.atan2(dy, dx);
    const cos = (reach * reach + l1 * l1 - l2 * l2) / (2 * reach * l1);
    const alpha = Math.acos(Math.max(-1, Math.min(1, cos)));
    const angle = base - alpha;
    return {
      x: hip.x + Math.cos(angle) * l1,
      y: hip.y + Math.sin(angle) * l1
    };
  }

  function updateLeg(parts, hip, pedal, l1, l2) {
    const ankle = { x: pedal.x - 2, y: pedal.y - 14 };
    const knee = solveKnee(hip, ankle, l1, l2);

    parts.thigh.setAttribute("d", `M${f(hip.x)} ${f(hip.y)} L${f(knee.x)} ${f(knee.y)}`);
    parts.shin.setAttribute("d", `M${f(knee.x)} ${f(knee.y)} L${f(ankle.x)} ${f(ankle.y)}`);
    parts.knee.setAttribute("cx", f(knee.x));
    parts.knee.setAttribute("cy", f(knee.y));
    parts.foot.setAttribute("transform", `translate(${f(ankle.x)} ${f(ankle.y)})`);
  }

  function scarfRibbon(t, baseX, baseY, phase, length, width, amplitude) {
    const a = Math.sin(t * 6.0 + phase);
    const b = Math.sin(t * 6.0 + phase + 1.2);
    const c = Math.sin(t * 4.5 + phase + 0.5);
    const tipX = baseX - length;
    const tipY = baseY + 3 + c * amplitude;

    return [
      `M ${f(baseX)} ${f(baseY - width / 2)}`,
      `C ${f(baseX - 30)} ${f(baseY - width / 2 + a * amplitude * 0.4)} ${f(baseX - 62)} ${f(baseY - width / 2 + b * amplitude * 0.8)} ${f(baseX - 91)} ${f(baseY - width / 2 + a * amplitude)}`,
      `C ${f(baseX - 112)} ${f(baseY - width / 2 + c * amplitude * 0.8)} ${f(tipX + 16)} ${f(tipY - 5)} ${f(tipX)} ${f(tipY)}`,
      `L ${f(tipX + 11)} ${f(tipY + 11)}`,
      `C ${f(baseX - 115)} ${f(baseY + width / 2 + c * amplitude * 0.7)} ${f(baseX - 68)} ${f(baseY + width / 2 + b * amplitude * 0.5)} ${f(baseX)} ${f(baseY + width / 2)}`,
      "Z"
    ].join(" ");
  }

  function render() {
    const t = state.t;
    const crankRad = state.crank * Math.PI / 180;
    const bob = Math.sin(crankRad * 2) * 2.2;

    refs.rearWheel.setAttribute("transform", `rotate(${f(state.wheel)})`);
    refs.frontWheel.setAttribute("transform", `rotate(${f(state.wheel)})`);
    refs.chainring.setAttribute("transform", `rotate(${f(state.crank)})`);

    const nearPedal = {
      x: BB.x + Math.cos(crankRad) * PEDAL_RADIUS,
      y: BB.y + Math.sin(crankRad) * PEDAL_RADIUS
    };
    const farPedal = {
      x: BB.x - Math.cos(crankRad) * PEDAL_RADIUS,
      y: BB.y - Math.sin(crankRad) * PEDAL_RADIUS
    };

    refs.nearArm.setAttribute("x2", f(nearPedal.x));
    refs.nearArm.setAttribute("y2", f(nearPedal.y));
    refs.nearPedal.setAttribute("transform", `translate(${f(nearPedal.x)} ${f(nearPedal.y)})`);

    refs.farArm.setAttribute("x2", f(farPedal.x));
    refs.farArm.setAttribute("y2", f(farPedal.y));
    refs.farPedal.setAttribute("transform", `translate(${f(farPedal.x)} ${f(farPedal.y)})`);

    refs.bodyGroup.setAttribute("transform", `translate(0 ${f(bob)})`);
    refs.headGroup.setAttribute("transform", `rotate(${f(Math.sin(crankRad * 2 + 0.9) * 1.4)} 700 214)`);
    refs.tailGroup.setAttribute("transform", `rotate(${f(Math.sin(crankRad + 0.8) * 2.6)} 470 370)`);

    updateLeg({
      thigh: refs.nearThigh,
      shin: refs.nearShin,
      knee: refs.nearKnee,
      foot: refs.nearFoot
    }, { x: 519, y: 398 + bob }, nearPedal, 112, 128);

    updateLeg({
      thigh: refs.farThigh,
      shin: refs.farShin,
      knee: refs.farKnee,
      foot: refs.farFoot
    }, { x: 506, y: 394 + bob }, farPedal, 110, 126);

    refs.scarfMain.setAttribute("d", scarfRibbon(t, 626, 300, 0, 112, 20, 10));
    refs.scarfBack.setAttribute("d", scarfRibbon(t, 624, 308, 1.9, 82, 13, 8));

    const blinkCycle = 4.7;
    const blinkPhase = (t + 1.6) % blinkCycle;
    const closed = blinkPhase > blinkCycle - 0.16;
    refs.eyeOpen.setAttribute("opacity", closed ? "0" : "1");
    refs.eyeClosed.setAttribute("opacity", closed ? "1" : "0");

    refs.chainDots.setAttribute("stroke-dashoffset", f(-state.crank * 0.55));

    const farOffset = -((t * 17) % 1200);
    const fenceOffset = -((t * 58) % 1200);
    refs.farTreesWrap.setAttribute("transform", `translate(${f(farOffset)} 0)`);
    refs.nearFenceWrap.setAttribute("transform", `translate(${f(fenceOffset)} 0)`);
    refs.roadDash.setAttribute("stroke-dashoffset", f(-(t * 230) % 92));

    refs.clouds.forEach((cloud, index) => {
      if (!cloud.el) return;
      const x = ((cloud.x + t * cloud.speed + 200) % 1500) - 200;
      const y = cloud.y + Math.sin(t * 0.42 + index * 1.7) * cloud.sway;
      cloud.el.setAttribute("transform", `translate(${f(x)} ${f(y)}) scale(${cloud.scale})`);
    });

    refs.birds.setAttribute("transform", `translate(${f(Math.sin(t * 0.35) * 6)} ${f(Math.sin(t * 1.1) * 3)})`);

    refs.dust.forEach((puff, index) => {
      if (!puff) return;
      const progress = ((t * 0.55 + index * 0.33) % 1);
      const x = 315 - progress * 132;
      const y = 640 - Math.sin(progress * Math.PI) * 18;
      puff.setAttribute("cx", f(x));
      puff.setAttribute("cy", f(y));
      puff.setAttribute("r", f(4 + progress * 9));
      puff.setAttribute("opacity", ((1 - progress) * 0.3).toFixed(3));
    });
  }

  function frame(now) {
    if (!state.last) state.last = now;
    const dt = Math.min(0.05, Math.max(0, (now - state.last) / 1000));
    state.last = now;

    if (!state.paused) {
      state.t += dt;
      state.wheel = (state.wheel + WHEEL_RATE * dt) % 360;
      state.crank = (state.crank + CRANK_RATE * dt) % 360;
      render();
    }

    requestAnimationFrame(frame);
  }

  refs.toggle.addEventListener("click", () => setPaused(!state.paused));

  window.addEventListener("keydown", (event) => {
    const target = event.target;
    const isButton = target instanceof HTMLElement && target.closest("button");
    if (event.code === "Space" && !isButton) {
      event.preventDefault();
      setPaused(!state.paused);
    }
  });

  document.addEventListener("visibilitychange", () => {
    state.last = performance.now();
  });

  if (typeof reducedMotion.addEventListener === "function") {
    reducedMotion.addEventListener("change", (event) => {
      if (event.matches) setPaused(true);
    });
  }

  updateToggle();
  render();
  state.last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
