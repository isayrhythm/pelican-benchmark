<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(180deg, #dff1ff 0%, #eef8ff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 {
    margin: 18px 0 4px;
    font-size: 22px;
    color: #2b6cb0;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .sub {
    margin: 0 0 12px;
    font-size: 13px;
    color: #7a9bb8;
  }
  .stage {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(43, 108, 176, 0.18);
    padding: 8px;
  }
  svg {
    display: block;
    width: min(92vw, 900px);
    height: auto;
    border-radius: 12px;
  }
  .sun { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  .cloud1 { animation: drift 55s linear infinite; }
  .cloud2 { animation: drift 85s linear infinite; animation-delay: -30s; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(1120px); }
  }
  .roadmark { animation: road 0.467s linear infinite; }
  @keyframes road {
    from { transform: translateX(0); }
    to   { transform: translateX(-70px); }
  }
</style>
<!-- 内嵌展示适配，兼容直接从本地打开；不改变图形和动画逻辑。 -->
<script>
// 展示适配层：不改 SVG 图形、动画、原按钮或其事件处理。
(()=>{
 if(new URLSearchParams(location.search).get('embed')!=='1')return;
 function fit(){
  const candidates=[...document.querySelectorAll('svg[viewBox]')];
  const art=candidates.sort((a,b)=>{
   const area=s=>{const v=s.viewBox.baseVal;return v.width*v.height};
   return area(b)-area(a);
  })[0];
  if(!art)return;
  const stage=art.closest('#canvasWrapper, #animationContainer, div.scene, .card')||art;
  const controls=document.querySelector('footer:has(button), .footer:has(button), .controls:has(button)');
  const viewport=document.createElement('div');viewport.className='bb-viewport';
  const canvas=document.createElement('div');canvas.className='bb-canvas';
  viewport.append(canvas);canvas.append(stage);
  stage.classList.add('bb-stage');art.classList.add('bb-art');
  art.setAttribute('preserveAspectRatio','xMidYMid meet');
  if(controls){controls.classList.add('bb-controls');viewport.append(controls)}
  document.body.append(viewport);document.documentElement.classList.add('bb-embed');
  const style=document.createElement('style');
  style.textContent=`
   html.bb-embed,html.bb-embed body{width:100%!important;height:100%!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}
   .bb-embed body{display:block!important}
   .bb-embed body>:not(.bb-viewport):not(script):not(style){display:none!important}
   .bb-viewport{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important}
   .bb-canvas{width:100%!important;flex:1!important;min-height:0!important;overflow:hidden!important;display:flex!important;align-items:stretch!important}
   .bb-stage{width:100%!important;height:100%!important;min-height:0!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;aspect-ratio:auto!important;overflow:hidden!important}
   svg.bb-art{display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;flex:1!important}
   .bb-stage .hint{display:none!important}
   .bb-controls{display:flex!important;flex:0 0 auto!important;flex-wrap:wrap!important;align-items:center!important;justify-content:center!important;gap:4px!important;min-width:0!important;max-width:none!important;width:100%!important;margin:0!important;padding:5px 6px!important;border:0!important;border-radius:0!important;box-shadow:none!important;font-size:10px!important;line-height:1.3!important;box-sizing:border-box!important}
   .bb-controls .caption,.bb-controls>div:last-child:has(#cadenceBadge){display:none!important}
   .bb-controls .controls,.bb-controls .button-group,.bb-controls>div{display:flex;align-items:center;gap:4px!important;min-width:0!important}
   .bb-controls .slider-group,.bb-controls>div:has(>input[type=range]){flex:1 1 100%!important;max-width:none!important;min-width:0!important;gap:5px!important}
   .bb-controls button{padding:4px 6px!important;font-size:10px!important;line-height:1.3!important;min-width:0!important;white-space:nowrap!important;border-radius:5px!important}
   .bb-controls label,.bb-controls span{font-size:10px!important;white-space:nowrap!important}
   .bb-controls input[type=range]{width:60px!important;min-width:20px!important;flex:1!important}
   .bb-controls button svg{width:12px!important;height:12px!important;flex:none!important}
  `;
  document.head.append(style);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fit,{once:true});else fit();
})();
</script>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <p class="sub">纯 SVG · 2D 循环动画</p>
  <div class="stage">
    <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的2D动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#aed6f7"/>
          <stop offset="1" stop-color="#e8f6ff"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9ccc65"/>
          <stop offset="1" stop-color="#6fae42"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/>
          <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bodyGrad" cx="0.4" cy="0.35" r="0.9">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e9e9e9"/>
        </radialGradient>
        <radialGradient id="pouchGrad" cx="0.5" cy="0.3" r="0.9">
          <stop offset="0" stop-color="#f9c169"/>
          <stop offset="1" stop-color="#ef8f4f"/>
        </radialGradient>

        <g id="wheelShape">
          <circle r="60" fill="none" stroke="#333" stroke-width="8"/>
          <circle r="52" fill="none" stroke="#c2c2c2" stroke-width="3"/>
          <line x1="0" y1="0" x2="50" y2="0" stroke="#9a9a9a" stroke-width="2"/>
          <line x1="0" y1="0" x2="35.36" y2="35.36" stroke="#9a9a9a" stroke-width="2"/>
          <line x1="0" y1="0" x2="0" y2="50" stroke="#9a9a9a" stroke-width="2"/>
          <line x1="0" y1="0" x2="-35.36" y2="35.36" stroke="#9a9a9a" stroke-width="2"/>
          <line x1="0" y1="0" x2="-50" y2="0" stroke="#9a9a9a" stroke-width="2"/>
          <line x1="0" y1="0" x2="-35.36" y2="-35.36" stroke="#9a9a9a" stroke-width="2"/>
          <line x1="0" y1="0" x2="0" y2="-50" stroke="#9a9a9a" stroke-width="2"/>
          <line x1="0" y1="0" x2="35.36" y2="-35.36" stroke="#9a9a9a" stroke-width="2"/>
          <circle r="6" fill="#666"/>
        </g>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="900" height="470" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g class="sun">
        <circle cx="760" cy="90" r="80" fill="url(#sunGlow)"/>
        <circle cx="760" cy="90" r="44" fill="#ffd54f"/>
        <circle cx="760" cy="90" r="34" fill="#ffec99"/>
      </g>

      <!-- 云 -->
      <g transform="translate(-160,80)">
        <g class="cloud1">
          <ellipse cx="0" cy="0" rx="42" ry="21" fill="#ffffff" opacity="0.92"/>
          <ellipse cx="36" cy="-9" rx="31" ry="18" fill="#ffffff" opacity="0.92"/>
          <ellipse cx="-32" cy="4" rx="27" ry="15" fill="#ffffff" opacity="0.92"/>
        </g>
      </g>
      <g transform="translate(-160,140)">
        <g class="cloud2">
          <ellipse cx="0" cy="0" rx="34" ry="17" fill="#ffffff" opacity="0.85"/>
          <ellipse cx="28" cy="-7" rx="25" ry="14" fill="#ffffff" opacity="0.85"/>
          <ellipse cx="-26" cy="4" rx="22" ry="12" fill="#ffffff" opacity="0.85"/>
        </g>
      </g>

      <!-- 地面 -->
      <rect x="0" y="470" width="900" height="90" fill="url(#grass)"/>
      <rect x="0" y="470" width="900" height="30" fill="#e7d8bd"/>
      <g class="roadmark">
        <line x1="-100" y1="487" x2="1000" y2="487" stroke="#c7b48c" stroke-width="3" stroke-dasharray="40 30"/>
      </g>
      <path d="M110 548 q7 -20 4 -38 q-7 18 -11 34 z" fill="#5e9c3a"/>
      <path d="M640 545 q6 -16 3 -30 q-6 14 -9 27 z" fill="#5e9c3a"/>
      <path d="M800 550 q7 -18 4 -34 q-6 15 -10 30 z" fill="#5e9c3a"/>

      <!-- 地面阴影 -->
      <ellipse cx="420" cy="473" rx="215" ry="12" fill="#000000" opacity="0.10"/>

      <!-- 远侧曲柄 + 踏板（背景） -->
      <g id="farCrank">
        <line x1="0" y1="0" x2="-40" y2="0" stroke="#a07b4a" stroke-width="7" stroke-linecap="round"/>
        <g id="pedalFar" transform="translate(-40,0)">
          <rect x="-17" y="-5" width="34" height="10" rx="3" fill="#8a6a44"/>
        </g>
      </g>

      <!-- 远侧腿（背景，踩在远侧踏板上） -->
      <g id="farLeg">
        <line id="farThigh" stroke="#c07f2a" stroke-width="7" stroke-linecap="round"/>
        <line id="farShin" stroke="#c07f2a" stroke-width="6" stroke-linecap="round"/>
        <ellipse id="farFoot" rx="15" ry="7" fill="#b07020"/>
      </g>

      <!-- 车轮 -->
      <g transform="translate(250,410)"><g id="rearWheelSpin"><use href="#wheelShape"/></g></g>
      <g transform="translate(590,410)"><g id="frontWheelSpin"><use href="#wheelShape"/></g></g>

      <!-- 车架 -->
      <g stroke="#3a3a3a" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="420" y1="410" x2="350" y2="285"/>
        <line x1="350" y1="285" x2="540" y2="300"/>
        <line x1="420" y1="410" x2="540" y2="300"/>
        <line x1="250" y1="410" x2="420" y2="410"/>
        <line x1="350" y1="285" x2="250" y2="410"/>
        <line x1="540" y1="300" x2="590" y2="410"/>
      </g>

      <!-- 近侧曲柄 + 踏板（前景） -->
      <g id="nearCrank">
        <line x1="0" y1="0" x2="40" y2="0" stroke="#6b4a2a" stroke-width="8" stroke-linecap="round"/>
        <g id="pedalNear" transform="translate(40,0)">
          <rect x="-17" y="-5" width="34" height="10" rx="3" fill="#5a3d22"/>
        </g>
        <circle r="7" fill="#444"/>
      </g>

      <!-- 车把 + 车座 -->
      <g stroke="#3a3a3a" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="540" y1="300" x2="558" y2="266"/>
        <line x1="552" y1="268" x2="578" y2="265"/>
      </g>
      <ellipse cx="350" cy="282" rx="27" ry="10" fill="#333"/>
      <circle cx="573" cy="265" r="6" fill="#333"/>

      <!-- 鹈鹕上身（含尾部/脖子/身体/头/喙/眼睛/翅膀，整体轻微上下浮动） -->
      <g id="pelicanUpper">
        <path d="M 272 214 L 236 194 L 266 244 Z" fill="#ececec" stroke="#d8d8d8" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M 396 200 Q 424 178 438 150" fill="none" stroke="#d8d8d8" stroke-width="29" stroke-linecap="round"/>
        <path d="M 396 200 Q 424 178 438 150" fill="none" stroke="#f7f7f7" stroke-width="24" stroke-linecap="round"/>
        <ellipse cx="345" cy="222" rx="82" ry="50" fill="url(#bodyGrad)" stroke="#d8d8d8" stroke-width="1.5"/>
        <circle cx="445" cy="138" r="24" fill="#fbfbfb" stroke="#d8d8d8" stroke-width="1.5"/>

        <!-- 喙 -->
        <path d="M 458 127 C 505 124, 550 132, 577 140 C 583 144, 583 149, 575 152 C 528 154, 490 152, 465 150 Z"
              fill="#f2a53c" stroke="#d9822b" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M 465 150 C 500 154, 535 155, 552 152 C 574 178, 572 200, 548 210 C 520 222, 486 214, 470 196 C 458 182, 459 162, 465 150 Z"
              fill="url(#pouchGrad)" stroke="#d9822b" stroke-width="1.5" stroke-linejoin="round"/>

        <!-- 眼睛 -->
        <circle cx="452" cy="128" r="6.5" fill="#1c1c1c"/>
        <circle cx="454" cy="126" r="2" fill="#ffffff"/>

        <!-- 翅膀 -->
        <g id="wing">
          <path d="M 300 200 C 325 184, 365 186, 392 202 C 366 220, 322 224, 300 214 Z"
                fill="#eeeeee" stroke="#d8d8d8" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- 近侧腿（前景，踩在近侧踏板上） -->
      <g id="nearLeg">
        <line id="nearThigh" stroke="#e8922c" stroke-width="8" stroke-linecap="round"/>
        <line id="nearShin" stroke="#e8922c" stroke-width="7" stroke-linecap="round"/>
        <ellipse id="nearFoot" rx="16" ry="7.5" fill="#e08a2b"/>
      </g>
    </svg>
  </div>

<script>
(function () {
  var BB = { x: 420, y: 410 };
  var CRANK = 40, THIGH = 92, SHIN = 92;
  var nearHip = { x: 372, y: 292 };
  var farHip  = { x: 342, y: 290 };
  var W = 2.5; // 角速度 rad/s，与路面虚线速度(150px/s)匹配

  var farCrank   = document.getElementById('farCrank');
  var nearCrank  = document.getElementById('nearCrank');
  var pedalFar   = document.getElementById('pedalFar');
  var pedalNear  = document.getElementById('pedalNear');
  var rearSpin   = document.getElementById('rearWheelSpin');
  var frontSpin  = document.getElementById('frontWheelSpin');
  var upper      = document.getElementById('pelicanUpper');
  var wing       = document.getElementById('wing');

  var farThigh  = document.getElementById('farThigh');
  var farShin   = document.getElementById('farShin');
  var farFoot   = document.getElementById('farFoot');
  var nearThigh = document.getElementById('nearThigh');
  var nearShin  = document.getElementById('nearShin');
  var nearFoot  = document.getElementById('nearFoot');

  function ik(hip, fx, fy) {
    var dx = fx - hip.x, dy = fy - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 0.001) return { x: hip.x, y: hip.y };
    var L1 = THIGH, L2 = SHIN;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    if (a < 0) a = 0;
    var hh = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var bx = hip.x + dx * (a / d), by = hip.y + dy * (a / d);
    var px = -dy / d * hh, py = dx / d * hh;
    var k1x = bx + px, k1y = by + py;
    var k2x = bx - px, k2y = by - py;
    // 膝盖朝前（取 x 较大一侧）
    return (k1x >= k2x) ? { x: k1x, y: k1y } : { x: k2x, y: k2y };
  }

  function setLeg(thigh, shin, foot, hip, fx, fy) {
    var k = ik(hip, fx, fy);
    thigh.setAttribute('x1', hip.x); thigh.setAttribute('y1', hip.y);
    thigh.setAttribute('x2', k.x);   thigh.setAttribute('y2', k.y);
    shin.setAttribute('x1', k.x);    shin.setAttribute('y1', k.y);
    shin.setAttribute('x2', fx);     shin.setAttribute('y2', fy);
    foot.setAttribute('cx', fx);     foot.setAttribute('cy', fy);
  }

  var t0 = null;
  function frame(ts) {
    if (t0 == null) t0 = ts;
    var t = (ts - t0) / 1000;
    var th = W * t;
    var deg = th * 180 / Math.PI;

    rearSpin.setAttribute('transform', 'rotate(' + deg + ')');
    frontSpin.setAttribute('transform', 'rotate(' + deg + ')');
    farCrank.setAttribute('transform', 'rotate(' + deg + ' ' + BB.x + ' ' + BB.y + ')');
    nearCrank.setAttribute('transform', 'rotate(' + deg + ' ' + BB.x + ' ' + BB.y + ')');
    pedalFar.setAttribute('transform', 'translate(-40,0) rotate(' + (-deg) + ')');
    pedalNear.setAttribute('transform', 'translate(40,0) rotate(' + (-deg) + ')');

    var nfx = BB.x + CRANK * Math.cos(th);
    var nfy = BB.y + CRANK * Math.sin(th);
    var ffx = BB.x - CRANK * Math.cos(th);
    var ffy = BB.y - CRANK * Math.sin(th);

    setLeg(nearThigh, nearShin, nearFoot, nearHip, nfx, nfy);
    setLeg(farThigh, farShin, farFoot, farHip, ffx, ffy);

    upper.setAttribute('transform', 'translate(0,' + (3 * Math.sin(th * 2)) + ')');
    wing.setAttribute('transform', 'rotate(' + (10 * Math.sin(t * 1.6)) + ' 350 200)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
